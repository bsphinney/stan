          padding:'0.12rem 0.45rem', fontSize:'0.7rem',
          background: view === k ? 'var(--accent)' : 'transparent',
          color: view === k ? '#000' : 'var(--muted)',
          border:'1px solid var(--border)', borderRadius:'0.2rem',
          cursor:'pointer',
        }}>{lab}</button>
      );

      return (
        <div>
          {/* View selector — replaces the unreadable 50-entry legend with a
              focused outliers-only / newest-10 view */}
          <div style={{display:'flex', gap:'0.25rem', marginBottom:'0.3rem',
                       justifyContent:'flex-end', alignItems:'center',
                       fontSize:'0.7rem', color:'var(--muted)'}}>
            <span style={{marginRight:'0.3rem'}}>Show:</span>
            {viewBtn('all', `All (${baseSeries.length})`)}
            {viewBtn('outliers', 'Outliers (top 5 vs median)')}
            {viewBtn('recent10', 'Newest 10')}
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} style={{width:'100%', height:`${height}px`}}>
            {/* RT axis tick marks */}
            {Array.from({length: 6}, (_, i) => {
              const rt = rtMin + (i / 5) * rtRange;
              const x = padding + (i / 5) * w;
              return (
                <g key={`xt-${i}`}>
                  <line x1={x} y1={height-padding} x2={x} y2={height-padding+4}
                        stroke="var(--muted)" strokeWidth="0.5" />
                  <text x={x} y={height-padding+15} fill="var(--muted)"
                        fontSize="10" textAnchor="middle">
                    {rt.toFixed(1)}
                  </text>
                </g>
              );
            })}
            <text x={width/2} y={height-2} fill="var(--muted)" fontSize="10"
                  textAnchor="middle">RT (min)</text>
            <text x={padding-22} y={padding+4} fill="var(--muted)" fontSize="10"
                  textAnchor="start">
              {normalize ? 'Intensity (normalized)' : 'Intensity (raw)'}
            </text>

            {/* Median reference curve — only shown in outliers mode so the
                operator can see what "normal" looks like. Gray dashed. */}
            {view === 'outliers' && medianCurve && (() => {
              const pts = medianCurve.rt.map((t, i) => {
                const x = padding + ((t - rtMin) / rtRange) * w;
                const y = padding + h - ((medianCurve.y[i] - yMin) / yRange) * h;
                return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
              }).join(' ');
              return (
                <path d={pts} fill="none" stroke="#94a3b8"
                      strokeWidth="2" strokeDasharray="6,4" opacity="0.6">
                  <title>Cohort median TIC</title>
                </path>
              );
            })()}

            {/* TIC lines — oldest first so newest (thicker) paints on top */}
            {series.map((s, si) => {
              const c = traceColor(si, palette);
              const lw = traceWidth(si, series.length);
              const isHover = hoverId === s.run.run_id;
              const dim = hoverId && !isHover;
              const pts = s.rt.map((t, i) => {
                const x = padding + ((t - rtMin) / rtRange) * w;
                const y = padding + h - ((s.y[i] - yMin) / yRange) * h;
                return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
              }).join(' ');
              const dt = new Date(s.run.run_date);
              const timeStr = dt.toLocaleString([], {hour:'2-digit', minute:'2-digit'});
              const ids = s.run.mode === 'DDA' ? s.run.n_psms : s.run.n_precursors;
              const idsLabel = s.run.mode === 'DDA' ? 'PSMs' : 'precursors';
              const devStr = deviations.get(s.run.run_id);
              const tip = `${s.run.run_name}\n${timeStr} · ${s.run.instrument}\n` +
                          `IPS ${s.run.ips_score || '—'} · ${ids ? ids.toLocaleString() : '—'} ${idsLabel}` +
                          (devStr != null ? `\ndeviation vs median: ${devStr.toFixed(3)}` : '');
              return (
                <path key={`tic-${s.run.run_id}`} d={pts} fill="none"
                      stroke={c} strokeWidth={isHover ? lw + 1.5 : lw}
                      opacity={dim ? 0.15 : 0.95}
                      onMouseEnter={() => setHoverId(s.run.run_id)}
                      onMouseLeave={() => setHoverId(null)}
                      style={{cursor:'pointer'}}>
                  <title>{tip}</title>
                </path>
              );
            })}

            {/* cIRT anchor markers for the MOST RECENT run only — drawn
                as small downward triangles at the bottom of the chart.
                Showing every run's markers (10 peptides × 5 runs = 50
                triangles) would be unreadable; the latest run is what
                the operator cares about. Trend across the day is in
                the dedicated Trends → cIRT card. Only QC panels render
                these — Sample/Blank don't go through DIA-NN. */}
            {showCirtMarkers && (() => {
              const latest = series[series.length - 1];
              const markers = latest?.run?.cirt_markers || [];
              if (!markers.length) return null;
              const MARKER_COLORS = {
                green:   '#16a34a',
                yellow:  '#eab308',
                red:     '#dc2626',
                unknown: '#94a3b8',
              };
              const yBase = height - padding;  // bottom of chart area
              return markers.map((m, mi) => {
                if (m.observed_rt_min == null) return null;
                const x = padding + ((m.observed_rt_min - rtMin) / rtRange) * w;
                if (x < padding || x > width - padding) return null;
                const c = MARKER_COLORS[m.deviation_class] || MARKER_COLORS.unknown;
                const devStr = m.deviation_min != null
                  ? (m.deviation_min >= 0 ? '+' : '') + m.deviation_min.toFixed(3) + ' min'
                  : 'n/a';
                const refStr = m.reference_rt_min != null
                  ? m.reference_rt_min.toFixed(2) + ' min'
                  : 'n/a';
                const tip =
                  `${m.peptide}\n` +
                  `Observed: ${m.observed_rt_min.toFixed(3)} min\n` +
                  `Reference: ${refStr}\n` +
                  `Δ: ${devStr}  (${m.deviation_class})`;
                // v0.2.146: triangles enlarged 4px→8px wide, 7px→13px tall
                // with a black stroke so they read cleanly on any background.
                const TRI_W = 8, TRI_H = 13;
                const tri = `${x.toFixed(1)},${yBase.toFixed(1)} ` +
                            `${(x-TRI_W).toFixed(1)},${(yBase-TRI_H).toFixed(1)} ` +
                            `${(x+TRI_W).toFixed(1)},${(yBase-TRI_H).toFixed(1)}`;
                // Dotted vertical guide from the triangle up into the
                // chart so the operator can eyeball which part of the
                // TIC the peptide anchors to.
                return (
                  <g key={`cirt-${mi}`}>
                    <line x1={x} y1={padding} x2={x} y2={yBase-TRI_H}
                          stroke={c} strokeDasharray="2,3"
                          strokeWidth="0.9" opacity="0.5" />
                    <polygon points={tri} fill={c} stroke="#000" strokeWidth="1" strokeLinejoin="round">
                      <title>{tip}</title>
                    </polygon>
                  </g>
                );
              });
            })()}
          </svg>
          {/* Legend: one entry per trace with time + full run name.
              v0.2.146: legend now shows run_name (truncated, with full
              name on hover) — Brett pointed out the old legend only
              showed the instrument key which was useless for telling
              traces apart. Swatch width matches the line's thickness
              (recency). */}
          <div style={{display:'flex', flexDirection:'column', gap:'0.2rem',
                       fontSize:'0.72rem', color:'var(--text)',
                       marginTop:'0.4rem', paddingLeft:'1rem'}}>
            {series.map((s, si) => {
              const c = traceColor(si, palette);
              const lw = traceWidth(si, series.length);
              const dt = new Date(s.run.run_date);
              const timeStr = dt.toLocaleString([], {hour:'2-digit', minute:'2-digit'});
              const fullName = s.run.run_name || '—';
              const shortName = fullName.length > 48
                ? fullName.slice(0, 45) + '…'
                : fullName;
              return (
                <span key={`leg-${s.run.run_id}`}
                      title={fullName}
                      style={{display:'inline-flex', alignItems:'center',
                              gap:'0.45rem', fontVariantNumeric:'tabular-nums'}}>
                  <span style={{width:'1.1rem', height:`${lw}px`, background:c,
                                display:'inline-block', borderRadius:'1px',
                                flexShrink:0}} />
                  <span style={{color:'var(--muted)', width:'3.2rem', flexShrink:0}}>
                    {timeStr}
                  </span>
                  <span style={{fontFamily:'ui-monospace, Menlo, monospace',
                                whiteSpace:'nowrap', overflow:'hidden',
                                textOverflow:'ellipsis'}}>
                    {shortName}
                  </span>
                </span>
              );
            })}
          </div>
        </div>
      );
    }

    // Classify a run as "failed" — near-zero results indicate a broken
    // injection, empty file, or failed search rather than just a weak
    // sample. Mirrors the stan.community.validate.HARD_GATES thresholds
    // so the dashboard and the community-submission gate agree on what
    // counts as a failed run (n_precursors<5000 for DIA, n_psms<5000
    // for DDA). Used for the "hide failed" filter toggle and the red
    // failure badge on rows that escape the filter (e.g. when toggle is off).
    function isFailedRun(r) {
      if (!r) return false;
      const mode = (r.mode || '').toUpperCase();
      if (mode === 'DDA') {
        return (r.n_psms || 0) < 5000;
      }
      // Default to DIA rules for anything non-DDA (diaPASEF, DIA, etc.)
      return (r.n_precursors || 0) < 5000;
    }

    // v0.2.185: parse the trailing Bruker/Thermo sequential file number
    // from a run_name. Examples:
    //   "22April2026_DIA_HeLa50_60spd_S1-A4_1_21144.d"      -> "21144"
    //   "FL220426_VelozB-UnivPe_60m_7.raw"                   -> "7"
    //   "1mai25_HeL50-C43tk078b3_100spd_S4-F6_1_12816.d"    -> "12816"
    // Strategy: strip extension, take the last "_" segment that's all
    // digits. If nothing matches, return empty so the cell stays blank
    // rather than showing a misleading partial match.
    function fileNumber(runName) {
      if (!runName) return '';
      const stem = String(runName).replace(/\.[dD]$/, '').replace(/\.raw$/i, '');
      const parts = stem.split('_');
      for (let i = parts.length - 1; i >= 0; i--) {
        if (/^\d+$/.test(parts[i])) return parts[i];
      }
      return '';
    }

    function RunHistory() {
      // Fetch with include_hidden=true so we can show/hide client-side
      // via a toggle without refetching. Hidden rows are filtered out
      // by default; the "Show hidden" toggle restores them with dim
      // styling so the operator can review or unhide.
      const { data: runs, loading, reload } = useFetch(
        '/api/runs?limit=1000&include_hidden=true'
      );
      const [sortKey, setSortKey] = useState('run_date');
      const [sortDir, setSortDir] = useState('desc');
      const [dateFilter, setDateFilter] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedRun, setSelectedRun] = useState(null);
      // Default: hide failed runs (near-zero results — see isFailedRun)
      // AND hide soft-deleted rows (hidden=1). Operator toggles them
      // back on with the controls at the top of the table.
      const [hideFailed, setHideFailed] = useState(true);
      const [showHidden, setShowHidden] = useState(false);
      // v0.2.350: instrument filter on QC History. Without it the page
      // mixed all instruments together when STAN_DB_PATH points at a
      // multi-instrument fleet DB (Brett 2026-05-08).
      const [instrumentFilter, setInstrumentFilter] = useState('__all__');

      if (loading) return <div className="empty">Loading...</div>;
      // Defensive: treat any non-array response as "no runs".
      if (!Array.isArray(runs) || runs.length === 0) {
        return <div className="empty">No runs recorded yet.</div>;
      }

      async function hideRun(run_id, current, runName) {
        const nowHidden = !current;
        let reason = '';
        if (nowHidden) {
          reason = window.prompt(
            `Hide "${runName}" from QC history?\n\n` +
            `Optional reason (saved with the row for later review):`,
            ''
          );
          if (reason === null) return;  // cancel
        }
        try {
          const res = await fetch(API + `/api/runs/${encodeURIComponent(run_id)}/hide`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hidden: nowHidden, reason: reason || '' }),
          });
          if (!res.ok) {
            const text = await res.text();
            alert(`Hide failed: ${res.status} ${text}`);
            return;
          }
          reload();
        } catch (e) {
          alert(`Hide failed: ${e}`);
        }
      }

      // Filter by date range
      const now = new Date();
      const filterDate = (runDate) => {
        const d = new Date(runDate);
        if (dateFilter === 'all') return true;
        if (dateFilter === 'today') {
          return d.toDateString() === now.toDateString();
        }
        if (dateFilter === 'week') {
          const weekAgo = new Date(now.getTime() - 7 * 86400000);
          return d >= weekAgo;
        }
        if (dateFilter === 'month') {
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        }
        if (dateFilter === 'year') {
          return d.getFullYear() === now.getFullYear();
        }
        if (dateFilter === 'past') {
          return d.getFullYear() < now.getFullYear();
        }
        return true;
      };

      // Filter + sort
      let filtered = runs.filter(r => filterDate(r.run_date));
      // Hidden-row filter (hidden=1 means operator soft-deleted it)
      if (!showHidden) {
        filtered = filtered.filter(r => !r.hidden);
      }
      // Failed-run filter (near-zero precursors/PSMs)
      if (hideFailed) {
        filtered = filtered.filter(r => !isFailedRun(r));
      }
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(r =>
          (r.run_name || '').toLowerCase().includes(term) ||
          (r.instrument || '').toLowerCase().includes(term)
        );
      }
      if (instrumentFilter !== '__all__') {
        filtered = filtered.filter(r => r.instrument === instrumentFilter);
      }
      // Unique instrument names for the dropdown (computed against the
      // unfiltered runs so all options remain visible after filtering).
      const allInstrumentNames = [...new Set(
        (runs || []).map(r => r.instrument).filter(Boolean)
      )].sort();
      const getSortVal = (r) => {
        if (sortKey === 'primary_ids') return (r.mode === 'DDA' ? r.n_psms : r.n_precursors) || 0;
        // v0.2.185: file number is derived from run_name, not a column
        if (sortKey === 'file_number') {
          const n = parseInt(fileNumber(r.run_name), 10);
          return isFinite(n) ? n : 0;
        }
        return r[sortKey];
      };
      filtered.sort((a, b) => {
        let va = getSortVal(a);
        let vb = getSortVal(b);
        if (va == null) va = sortKey === 'run_date' ? '' : 0;
        if (vb == null) vb = sortKey === 'run_date' ? '' : 0;
        if (typeof va === 'string') {
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return sortDir === 'asc' ? va - vb : vb - va;
      });

      const handleSort = (key) => {
        if (sortKey === key) {
          setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        } else {
          setSortKey(key);
          setSortDir('desc');
        }
      };

      const SortHeader = ({col, label}) => (
        <th onClick={() => handleSort(col)} style={{cursor: 'pointer', userSelect: 'none'}}>
          {label}{sortKey === col ? (sortDir === 'asc' ? ' ▲' : ' ▼') : ''}
        </th>
      );

      const EM_DASH = '\u2014';
      const fmtNum = (n) => (n != null && n > 0) ? n.toLocaleString() : EM_DASH;
      const fmtFloat = (n, d=1) => (n != null) ? n.toFixed(d) : EM_DASH;
      const fmtSig = (n) => {
        if (n == null || n === 0) return EM_DASH;
        if (n >= 1e12) return (n/1e12).toFixed(1) + 'T';
        if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
        if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
        return n.toFixed(0);
      };
      const fmtSigned = (n, d=2) => {
        if (n == null) return EM_DASH;
        const sign = n >= 0 ? '+' : '';
        return sign + n.toFixed(d);
      };
      // FWHM stored in minutes; display as seconds with 1 decimal
      const fmtFwhmSec = (n) => (n != null && n > 0) ? (n * 60).toFixed(1) : EM_DASH;
      // Primary identifications: precursors for DIA, PSMs for DDA
      const primaryIds = (r) => r.mode === 'DDA' ? r.n_psms : r.n_precursors;

      // v0.2.189: hide the Drift column entirely on Orbitrap-only
      // dashboards. Drift detection is Bruker diaPASEF only — Thermo
      // .raw files never get drift data, so an all-em-dash column is
      // wasted horizontal space. Shown when ANY run in the current
      // filtered set has drift_class set (so mixed fleets still see
      // it, and a Bruker install that currently shows zero drifted
      // runs still sees the OK badge).
      const showDriftCol = filtered.some(r =>
        r && r.drift_class && r.drift_class !== 'unknown'
      );

      return (
        <div className="card">
          <div style={{display:'flex', gap:'0.75rem', marginBottom:'0.75rem', flexWrap:'wrap', alignItems:'center'}}>
            <input
              type="text"
              placeholder="Search run name or instrument..."
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              style={{flex:'1 1 250px', padding:'0.4rem 0.6rem', background:'var(--bg)', color:'var(--text)', border:'1px solid var(--border)', borderRadius:'0.3rem'}}
            />
            <select
              value={instrumentFilter}
              onChange={e => setInstrumentFilter(e.target.value)}
              title="Filter QC History by instrument"
              style={{padding:'0.4rem 0.6rem', background:'var(--bg)', color:'var(--text)', border:'1px solid var(--border)', borderRadius:'0.3rem'}}
            >
              <option value="__all__">All instruments</option>
              {allInstrumentNames.map(n =>
                <option key={n} value={n}>{n}</option>
              )}
            </select>
            <select
              value={dateFilter}
              onChange={e => setDateFilter(e.target.value)}
              style={{padding:'0.4rem 0.6rem', background:'var(--bg)', color:'var(--text)', border:'1px solid var(--border)', borderRadius:'0.3rem'}}
            >
              <option value="all">All time</option>
              <option value="today">Today</option>
              <option value="week">This week</option>
              <option value="month">This month</option>
              <option value="year">This year</option>
              <option value="past">Past years</option>
            </select>
            <label style={{display:'inline-flex', alignItems:'center', gap:'0.3rem', fontSize:'0.8rem', color:'var(--muted)'}}>
              <input type="checkbox" checked={hideFailed}
                     onChange={e => setHideFailed(e.target.checked)} />
              Hide failed
            </label>
            <label style={{display:'inline-flex', alignItems:'center', gap:'0.3rem', fontSize:'0.8rem', color:'var(--muted)'}}>
              <input type="checkbox" checked={showHidden}
                     onChange={e => setShowHidden(e.target.checked)} />
              Show hidden
            </label>
            <span style={{color:'var(--muted)', fontSize:'0.85rem'}}>
              {filtered.length} / {runs.length} runs
            </span>
          </div>
          <div style={{overflowX: 'auto'}}>
            <table>
              <thead><tr>
                <SortHeader col="run_name" label="Run" />
                {/* v0.2.185: replaced Instrument with File # (Bruker
                    sequential number parsed from the run_name tail) so
                    the run number is always visible without truncation */}
                <SortHeader col="file_number" label="File #" />
                <SortHeader col="mode" label="Mode" />
                <SortHeader col="ips_score" label="IPS" />
                <SortHeader col="peg_class" label="PEG" />
                {showDriftCol && <SortHeader col="drift_class" label="Drift" />}
                <SortHeader col="primary_ids" label="Precursors / PSMs" />
                <SortHeader col="n_peptides" label="Peptides" />
                <SortHeader col="n_proteins" label="Proteins" />
                <SortHeader col="ms1_signal" label="MS1 Signal" />
                <SortHeader col="fwhm_rt_min" label="FWHM (s)" />
                <SortHeader col="median_mass_acc_ms1_ppm" label="Mass Acc ppm" />
                <SortHeader col="run_date" label="Date" />
                <th>Hide</th>
              </tr></thead>
              <tbody>
                {filtered.map(r => {
                  const ids = primaryIds(r);
                  const idsLabel = r.mode === 'DDA' ? 'PSMs' : 'Prec';
                  const failed = isFailedRun(r);
                  const isHidden = !!r.hidden;
                  // Dim hidden rows (visible only when "Show hidden"
                  // toggle is on) and subtly red-tint failed rows.
                  const rowStyle = {
                    cursor: 'pointer',
                    opacity: isHidden ? 0.5 : 1,
                    textDecoration: isHidden ? 'line-through' : 'none',
                    background: failed && !isHidden ? 'rgba(239,68,68,0.07)' : undefined,
                  };
                  return (
                    <tr key={r.id} onClick={() => setSelectedRun(r)} style={rowStyle}
                        title={isHidden ? `Hidden: ${r.hidden_reason || '(no reason given)'}` : (failed ? 'Near-zero result — flagged as failed run' : undefined)}>
                      <td style={{maxWidth:'280px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                          title={r.run_name}>
                        {failed && !isHidden && (
                          <span title="Failed run (below community-gate threshold)"
                                style={{display:'inline-block', width:'0.5rem', height:'0.5rem',
                                        background:'#ef4444', borderRadius:'50%',
                                        marginRight:'0.4rem', verticalAlign:'middle'}} />
                        )}
                        {r.run_name}
                      </td>
                      <td title={r.instrument || ''}>{fileNumber(r.run_name)}</td>
                      <td>{r.mode}</td>
                      <td><IpsBadge run={r} /></td>
                      <td><PegBadge run={r} /></td>
                      {showDriftCol && <td><DriftBadge run={r} /></td>}
                      <td title={`${idsLabel}: ${ids != null ? ids.toLocaleString() : EM_DASH}`}>
                        {fmtNum(ids)} <span style={{color:'var(--muted)', fontSize:'0.7rem'}}>{ids > 0 ? idsLabel : ''}</span>
                      </td>
                      <td>{fmtNum(r.n_peptides)}</td>
                      <td>{fmtNum(r.n_proteins)}</td>
                      <td>{r.ms1_signal ? r.ms1_signal.toExponential(2) : EM_DASH}</td>
                      <td>{fmtFwhmSec(r.fwhm_rt_min)}</td>
                      <td>{fmtSigned(r.median_mass_acc_ms1_ppm, 2)}</td>
                      <td>{new Date(r.run_date).toLocaleString([], {year:'2-digit', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                      <td>
                        <button
                          onClick={(e) => { e.stopPropagation(); hideRun(r.id, isHidden, r.run_name); }}
                          title={isHidden ? 'Restore this run to the QC history' : 'Hide this run from the QC history (reversible)'}
                          style={{
                            padding:'0.15rem 0.45rem', fontSize:'0.7rem',
                            background:'var(--bg)', color:'var(--text)',
                            border:'1px solid var(--border)', borderRadius:'0.25rem',
                            cursor:'pointer',
                          }}>
                          {isHidden ? '↺ Restore' : '× Hide'}
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {selectedRun && (
            <TicViewer
              runId={selectedRun.id}
              runName={selectedRun.run_name}
              instrument={selectedRun.instrument}
              spd={selectedRun.spd}
              onClose={() => setSelectedRun(null)}
            />
          )}
        </div>
      );
    }

    /* ── TIC Viewer Modal ──────────────────────────────────────────── */

    function TicViewer({ runId, runName, instrument, spd, onClose }) {
      const [tic, setTic] = useState(null);
      const [communityTic, setCommunityTic] = useState(null);
      const [loading, setLoading] = useState(true);
      const [showCommunity, setShowCommunity] = useState(true);

      useEffect(() => {
        fetch(API + `/api/runs/${runId}/tic`)
          .then(r => r.ok ? r.json() : null)
          .then(setTic)
          .catch(() => setTic(null))
          .finally(() => setLoading(false));
      }, [runId]);

      useEffect(() => {
        if (!instrument || !spd) return;
        // Infer instrument family
        const family = instrument.toLowerCase().includes('tims') ? 'timsTOF' :
                       instrument.toLowerCase().includes('astral') ? 'Astral' :
                       instrument.toLowerCase().includes('exploris') ? 'Exploris' :
                       instrument.toLowerCase().includes('lumos') || instrument.toLowerCase().includes('fusion') ? 'Fusion Lumos' :
                       'Orbitrap';
        // Try common cohort ID patterns
        const cohortIds = [
          `${family}_${spd}spd_low`,
          `${family}_${spd}spd`,
        ];
        (async () => {
          for (const cid of cohortIds) {
            try {
              const r = await fetch(`https://brettsp-stan.hf.space/api/cohorts/${encodeURIComponent(cid)}/tic`);
              if (r.ok) {
                const data = await r.json();
                if (data && data.median_tic) {
                  setCommunityTic(data);
                  return;
                }
              }
            } catch (e) {}
          }
        })();
      }, [instrument, spd]);

      if (loading) {
        return (
          <div style={{position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000}}>
            <div className="card">Loading TIC...</div>
          </div>
        );
      }
      if (!tic) {
        return (
          <div style={{position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000}} onClick={onClose}>
            <div className="card" style={{maxWidth:'500px'}}>
              <h3>No TIC data for this run</h3>
              <p>Re-run baseline with 0.2.40+ to extract TIC data.</p>
              <button onClick={onClose} style={{padding:'0.5rem 1rem', marginTop:'0.5rem'}}>Close</button>
            </div>
          </div>
        );
      }

      // Build SVG TIC plot
      const width = 900, height = 400, pad = 50;
      const rt = tic.rt_min;
      const intensity = tic.intensity;
      const rtMin = Math.min(...rt);
      const rtMax = Math.max(...rt);
      const maxInt = Math.max(...intensity);

      // Normalize run's TIC
      const runPoints = rt.map((r, i) => {
        const x = pad + ((r - rtMin) / (rtMax - rtMin)) * (width - 2*pad);
        const y = height - pad - (intensity[i] / maxInt) * (height - 2*pad);
        return [x, y];
      });
      const runPath = runPoints.map(([x,y],i) => `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');

      // Community median trace (if available and toggle on)
      let commPath = null;
      if (showCommunity && communityTic && communityTic.median_tic) {
        const cRt = communityTic.median_tic.rt;
        const cInt = communityTic.median_tic.intensity;
        const cMax = Math.max(...cInt);
        if (cMax > 0 && cRt.length > 1) {
          const cPoints = cRt.map((r, i) => {
            const x = pad + ((r - rtMin) / (rtMax - rtMin)) * (width - 2*pad);
            const y = height - pad - (cInt[i] / cMax) * (height - 2*pad);
            return [x, y];
          });
          commPath = cPoints.map(([x,y],i) => `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
        }
      }

      return (
        <div style={{position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.85)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000, padding:'1rem'}} onClick={onClose}>
          <div className="card" style={{maxWidth:'1000px', width:'100%', maxHeight:'90vh', overflow:'auto'}} onClick={e => e.stopPropagation()}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'1rem'}}>
              <div>
                <h3 style={{margin:0, wordBreak:'break-all'}}>{runName}</h3>
                <div style={{color:'var(--muted)', fontSize:'0.85rem', marginTop:'0.25rem'}}>
                  {instrument} · SPD {spd || '?'}
                </div>
              </div>
              <button onClick={onClose} style={{padding:'0.4rem 0.8rem', background:'var(--bg)', color:'var(--text)', border:'1px solid var(--border)', borderRadius:'0.3rem', cursor:'pointer'}}>✕ Close</button>
            </div>
            {communityTic && (
              <label style={{display:'inline-flex', alignItems:'center', gap:'0.4rem', marginBottom:'0.5rem', fontSize:'0.85rem', cursor:'pointer'}}>
                <input type="checkbox" checked={showCommunity} onChange={e => setShowCommunity(e.target.checked)} />
                Show community median ({communityTic.n_traces || 0} traces)
              </label>
            )}
            <svg viewBox={`0 0 ${width} ${height}`} style={{width:'100%', height:'auto', background:'var(--bg)', borderRadius:'0.3rem'}}>
              {/* Axes */}
              <line x1={pad} y1={height-pad} x2={width-pad} y2={height-pad} stroke="var(--muted)" strokeWidth="1" />
              <line x1={pad} y1={pad} x2={pad} y2={height-pad} stroke="var(--muted)" strokeWidth="1" />
              {/* Community median (dashed orange) */}
              {commPath && <path d={commPath} fill="none" stroke="#ff6b35" strokeWidth="2.5" strokeDasharray="6,4" />}
              {/* Run TIC (solid blue) */}
              <path d={runPath} fill="none" stroke="#60a5fa" strokeWidth="2" />
              {/* Labels */}
              <text x={width/2} y={height-10} fill="var(--muted)" fontSize="12" textAnchor="middle">Retention Time (min)</text>
              <text x={15} y={height/2} fill="var(--muted)" fontSize="12" textAnchor="middle" transform={`rotate(-90, 15, ${height/2})`}>Intensity</text>
              <text x={pad} y={pad+15} fill="#60a5fa" fontSize="11">━ This run</text>
              {commPath && <text x={pad} y={pad+30} fill="#ff6b35" fontSize="11">┅ Community median</text>}
              <text x={width-pad} y={pad+15} fill="var(--muted)" fontSize="11" textAnchor="end">
                RT: {rtMin.toFixed(1)} - {rtMax.toFixed(1)} min · {rt.length} bins
              </text>
            </svg>
          </div>
        </div>
      );
    }

    /* ── Maintenance Event Marker ──────────────────────────────────── */

    function EventMarker({ event }) {
      const [hover, setHover] = useState(false);
      const typeLabels = {
        column_change: 'Column change',
        source_clean: 'Source clean',
        calibration: 'Calibration',
        pm: 'PM',
        lc_service: 'LC service',
        downtime: 'Downtime',
        other: 'Other',
      };
      const typeColors = {
        column_change: 'var(--accent)',
        source_clean: 'var(--pass)',
        calibration: 'var(--warn)',
        pm: '#a78bfa',
        lc_service: '#f472b6',
        downtime: 'var(--fail)',
        other: 'var(--muted)',
      };
      const color = typeColors[event.event_type] || 'var(--muted)';
      const label = typeLabels[event.event_type] || event.event_type;

      return (
        <div
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
          style={{position:'relative', display:'inline-block'}}
        >
          <div style={{
            width:'2px', height:'100%', minHeight:'1.6rem',
            borderLeft:`2px dashed ${color}`, display:'inline-block', verticalAlign:'middle',
          }} />
          <span style={{
            fontSize:'0.65rem', color, fontWeight:700, marginLeft:'0.2rem',
            verticalAlign:'middle', cursor:'default',
          }}>
            {label}
          </span>
          {hover && (
            <div style={{
              position:'absolute', bottom:'100%', left:0, zIndex:10,
              background:'var(--surface)', border:'1px solid var(--border)',
              borderRadius:'0.4rem', padding:'0.4rem 0.6rem', fontSize:'0.75rem',
              whiteSpace:'nowrap', boxShadow:'0 4px 12px rgba(0,0,0,0.4)',
            }}>
              <div style={{fontWeight:700, color}}>{label}</div>
              <div style={{color:'var(--muted)'}}>{dateStr}</div>
              {event.operator && <div style={{color:'var(--muted)'}}>By: {event.operator}</div>}
              {event.notes && <div style={{color:'var(--text)', marginTop:'0.2rem'}}>{event.notes}</div>}
            </div>
          )}
        </div>
      );
    }

    /* ── Maintenance Events Table ─────────────────────────────────── */

    function MaintenanceEventsTable({ events }) {
      if (!events || events.length === 0) {
        return <div style={{color:'var(--muted)', fontSize:'0.85rem', padding:'0.5rem 0'}}>No maintenance events recorded.</div>;
      }

      return (
        <div style={{overflowX:'auto'}}>
          <table style={{fontSize:'0.8rem'}}>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Notes</th>
                <th>Column Info</th>
                <th>Operator</th>
                <th>Recorded</th>
              </tr>
            </thead>
            <tbody>
              {events.slice(0, 20).map(ev => {
                const color = maintColor(ev.event_type);
                const colInfo = [ev.column_vendor, ev.column_model, ev.column_serial,
                                 ev.first_run ? `from run ${ev.first_run}` : null].filter(Boolean).join(' / ');
                const [sKey, eKey] = eventSpan(ev);
                const sDate = dateFromDayKey(sKey);
                const eDate = dateFromDayKey(eKey);
                const dOpts = {year:'2-digit', month:'short', day:'numeric'};
                return (
                  <tr key={ev.id}>
                    <td style={{whiteSpace:'nowrap'}}>
                      {sDate ? sDate.toLocaleDateString([], dOpts) : '\u2014'}
                      {eDate && eKey !== sKey && ` \u2192 ${eDate.toLocaleDateString([], dOpts)}`}
                    </td>
                    <td>
                      <span style={{
                        display:'inline-block', padding:'0.1rem 0.4rem', borderRadius:'999px',
                        fontSize:'0.72rem', fontWeight:600, background:color, color:'#000',
                      }}>
                        {maintLabel(ev.event_type)}
                      </span>
                    </td>
                    <td style={{maxWidth:'300px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}} title={ev.notes || ''}>{ev.notes || '\u2014'}</td>
                    <td style={{color:'var(--muted)', fontSize:'0.75rem'}}>{colInfo || '\u2014'}</td>
                    <td style={{color:'var(--muted)'}}>{ev.operator || '\u2014'}</td>
                    {/* Who recorded the row and when — distinct from the
                        operator who did the work. Null on local installs. */}
                    <td style={{color:'var(--muted)', fontSize:'0.72rem'}}>{loggedByText(ev)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    /* ── Maintenance & Downtime Calendar ──────────────────────────── */

    /* Downtime is an interval, not an instant, and an interval is only
       legible when time runs along one axis: the per-instrument timeline
       draws a 9-day outage as one bar you can compare against the lane
       above it, where a month grid has to break it across two rows. So the
       timeline is the default. The month grid is still here behind a toggle
       because "what happened in June" is a question people ask a calendar,
       and it draws its spans as overlay bars across each week row rather
       than as one chip per day, so a span still reads as a span.

       Both views feed the same detail list below, which is the actual log:
       every entry carries who recorded it and when (created_by /
       created_at) — that attribution is what makes these rows usable as the
       raw material for the community reliability leaderboard (MTBF /
       availability / recovery time) in the README. */

    const MAINT_WINDOWS = [[30, '30 days'], [90, '90 days'], [180, '6 months'], [365, '1 year']];

    /* One-line tooltip for a bar or marker. Rendered into a title
       attribute, so React escapes it — never build markup from these. */
    function maintTip(ev) {
      const [s, e] = eventSpan(ev);
      const sd = dateFromDayKey(s), ed = dateFromDayKey(e);
      const dOpts = {month: 'short', day: 'numeric'};
      let when = sd ? sd.toLocaleDateString([], dOpts) : '(no date)';
      if (ed && e !== s) {
        when += ` → ${ed.toLocaleDateString([], dOpts)} (${daysBetween(sd, ed) + 1} days)`;
      }
      const bits = [`${maintLabel(ev.event_type)} · ${ev.instrument || 'unknown instrument'}`, when];
      if (ev.notes) bits.push(String(ev.notes));
      if (ev.operator) bits.push(`by ${ev.operator}`);
      bits.push(loggedByText(ev));
      return bits.join('\n');
    }

    function MaintLegend({ types }) {
      return (
        <div style={{display:'flex', flexWrap:'wrap', gap:'0.75rem', alignItems:'center',
                     fontSize:'0.72rem', color:'var(--muted)', marginTop:'0.6rem'}}>
          <span style={{display:'inline-flex', alignItems:'center', gap:'0.3rem'}}>
            <span style={{width:'22px', height:'8px', borderRadius:'2px', background:'var(--fail)'}} />
            Downtime (span)
          </span>
          {types.map(t => (
            <span key={t} style={{display:'inline-flex', alignItems:'center', gap:'0.3rem'}}>
              <span style={{width:'8px', height:'8px', transform:'rotate(45deg)', background:maintColor(t)}} />
              {maintLabel(t)}
            </span>
          ))}
          <span style={{display:'inline-flex', alignItems:'center', gap:'0.3rem'}}>
            <span style={{width:'2px', height:'12px', background:'var(--accent)'}} />
            today
          </span>
        </div>
      );
    }

    /* Per-instrument horizontal timeline. One lane per instrument, spans
       drawn as bars and point events as diamonds. */
    function MaintTimeline({ instruments, events, start, nDays, today, isDown, onPick, pickedId }) {
      const pctOf = d => (daysBetween(start, d) / nDays) * 100;

      // Month gridlines/labels. Always label the window start so a short
      // window that contains no 1st-of-month is still readable.
      const ticks = [];
      const firstOfNext = new Date(start.getFullYear(), start.getMonth() + 1, 1);
      for (let m = firstOfNext; daysBetween(start, m) < nDays; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
        ticks.push({key: localDay(m), pct: pctOf(m), label: m.toLocaleDateString([], {month: 'short'})});
      }
      const startLabel = start.toLocaleDateString([], {month: 'short', day: 'numeric'});
      const todayPct = Math.min(100, Math.max(0, pctOf(addDays(today, 1))));

      const laneEvents = name => events.filter(ev => (ev.instrument || '') === name);

      return (
        <div style={{marginTop:'0.75rem'}}>
          <div style={{display:'flex', alignItems:'flex-end', marginBottom:'0.2rem'}}>
            <div style={{width:'132px', flex:'none', fontSize:'0.68rem', color:'var(--muted)'}}>{startLabel}</div>
            <div style={{flex:1, position:'relative', height:'0.9rem'}}>
              {ticks.map(t => (
                <span key={t.key} style={{position:'absolute', left:`${t.pct}%`, fontSize:'0.68rem',
                                          color:'var(--muted)', whiteSpace:'nowrap'}}>{t.label}</span>
              ))}
            </div>
          </div>
          {instruments.map(name => {
            const evs = laneEvents(name);
            return (
              <div key={name} style={{display:'flex', alignItems:'center', gap:'0.5rem', marginBottom:'0.3rem'}}>
                <div title={name} style={{width:'132px', flex:'none', fontSize:'0.78rem',
                                          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                  {name}
                </div>
                <div style={{flex:1, position:'relative', height:'30px', background:'var(--bg)',
                             border:'1px solid var(--border)', borderRadius:'0.35rem'}}>
                  {ticks.map(t => (
                    <div key={t.key} style={{position:'absolute', left:`${t.pct}%`, top:0, bottom:0,
                                             width:'1px', background:'var(--border)'}} />
                  ))}
                  <div title="today" style={{position:'absolute', left:`${todayPct}%`, top:0, bottom:0,
                                             width:'2px', background:'var(--accent)', opacity:0.75}} />
                  {evs.map(ev => {
                    const [sKey, eKey] = eventSpan(ev);
                    const sd = dateFromDayKey(sKey);
                    if (!sd) return null;
                    const ed = dateFromDayKey(eKey) || sd;
                    const picked = pickedId === ev.id;
                    if (isDown(ev)) {
                      const l = Math.max(0, pctOf(sd));
                      const r = Math.min(100, pctOf(addDays(ed, 1)));
                      if (r <= 0 || l >= 100) return null;
                      return (
                        <div key={ev.id} title={maintTip(ev)} onClick={() => onPick(ev)}
                             style={{position:'absolute', left:`${l}%`, width:`${Math.max(r - l, 0.7)}%`,
                                     top:'8px', height:'14px', borderRadius:'3px',
                                     background:'var(--fail)', opacity: picked ? 1 : 0.82,
                                     border: picked ? '2px solid var(--accent)' : '1px solid rgba(0,0,0,0.35)',
                                     cursor:'pointer'}} />
                      );
                    }
                    const mid = pctOf(sd) + (0.5 / nDays) * 100;
                    if (mid < 0 || mid > 100) return null;
                    return (
                      <div key={ev.id} title={maintTip(ev)} onClick={() => onPick(ev)}
                           style={{position:'absolute', left:`${mid}%`, top:'50%', width:'10px', height:'10px',
                                   marginLeft:'-5px', marginTop:'-5px', transform:'rotate(45deg)',
                                   background:maintColor(ev.event_type),
                                   border: picked ? '2px solid var(--accent)' : '1px solid rgba(0,0,0,0.35)',
                                   cursor:'pointer'}} />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /* Month grid. Spans are drawn as an overlay layer per week row rather
       than as a chip per day, so a multi-day outage stays one continuous
       bar instead of dissolving into seven identical squares. */
    function MaintMonthGrid({ month, events, today, isDown, onPick, pickedId }) {
      const first = new Date(month.getFullYear(), month.getMonth(), 1);
      const nInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
      const gridStart = addDays(first, -first.getDay());
      const nWeeks = Math.ceil((first.getDay() + nInMonth) / 7);
      const todayKey = localDay(today);
      const downs = events.filter(isDown);
      const points = events.filter(ev => !isDown(ev));
      const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      return (
        <div style={{marginTop:'0.75rem'}}>
          <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'2px', marginBottom:'2px'}}>
            {dow.map(d => (
              <div key={d} style={{fontSize:'0.68rem', color:'var(--muted)', textAlign:'center'}}>{d}</div>
            ))}
          </div>
          {Array.from({length: nWeeks}, (_, w) => {
            const weekStart = addDays(gridStart, w * 7);
            const weekEndKey = localDay(addDays(weekStart, 6));
            const weekStartKey = localDay(weekStart);
            const bars = downs
              .map(ev => {
                const [s, e] = eventSpan(ev);
                const sd = dateFromDayKey(s);
                if (!sd) return null;
                const ed = dateFromDayKey(e) || sd;
                if (s > weekEndKey || localDay(ed) < weekStartKey) return null;
                const l = Math.max(0, daysBetween(weekStart, sd));
                const r = Math.min(7, daysBetween(weekStart, ed) + 1);
                return {ev, left: (l / 7) * 100, width: ((r - l) / 7) * 100};
              })
              .filter(Boolean);
            return (
              <div key={weekStartKey} style={{position:'relative', marginBottom:'2px'}}>
                <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'2px'}}>
                  {Array.from({length: 7}, (_, i) => {
                    const d = addDays(weekStart, i);
                    const key = localDay(d);
                    const inMonth = d.getMonth() === month.getMonth();
                    const dayPoints = points.filter(ev => dayKeyOf(ev.event_date) === key);
                    const covered = bars.some(b => {
                      const [s, e] = eventSpan(b.ev);
                      return key >= s && key <= (e || s);
                    });
                    return (
                      <div key={key} style={{
                        minHeight: `${34 + Math.max(bars.length, 1) * 9}px`,
                        border: key === todayKey ? '1px solid var(--accent)' : '1px solid var(--border)',
                        borderRadius:'0.3rem', padding:'0.2rem 0.25rem',
                        /* Translucent wash composites over whatever --bg is,
                           so the tint works in either theme without naming
                           a background colour. */
                        background: covered ? 'rgba(239,68,68,0.14)' : 'var(--bg)',
                        opacity: inMonth ? 1 : 0.4,
                      }}>
                        <div style={{fontSize:'0.68rem', color:'var(--muted)'}}>{d.getDate()}</div>
                        <div style={{display:'flex', flexWrap:'wrap', gap:'2px', marginTop:'auto'}}>
                          {dayPoints.map(ev => (
                            <span key={ev.id} title={maintTip(ev)} onClick={() => onPick(ev)}
                                  style={{width:'9px', height:'9px', transform:'rotate(45deg)',
                                          display:'inline-block', margin:'2px',
                                          background:maintColor(ev.event_type),
                                          border: pickedId === ev.id ? '2px solid var(--accent)' : 'none',
                                          cursor:'pointer'}} />
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div style={{position:'absolute', left:0, right:0, top:'20px', pointerEvents:'none'}}>
                  {bars.map((b, i) => (
                    <div key={b.ev.id} title={maintTip(b.ev)} onClick={() => onPick(b.ev)}
                         style={{position:'absolute', left:`${b.left}%`, width:`${b.width}%`,
                                 top:`${i * 9}px`, height:'7px', borderRadius:'2px',
                                 background:'var(--fail)', pointerEvents:'auto', cursor:'pointer',
                                 border: pickedId === b.ev.id ? '2px solid var(--accent)' : 'none',
                                 opacity:0.9}} />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /* The log itself. Every row names who recorded it and when. */
    function MaintEntryList({ events, isDown, onPick, pickedId }) {
      if (!events.length) {
        return (
          <div style={{color:'var(--muted)', fontSize:'0.85rem', padding:'0.75rem 0'}}>
            Nothing logged in this window. Use “Mark downtime” above to record an outage.
          </div>
        );
      }
      const dOpts = {month: 'short', day: 'numeric', year: 'numeric'};
      return (
        <div>
          {events.map(ev => {
            const [sKey, eKey] = eventSpan(ev);
            const sd = dateFromDayKey(sKey), ed = dateFromDayKey(eKey);
            const span = sd && ed && eKey !== sKey
              ? `${sd.toLocaleDateString([], dOpts)} → ${ed.toLocaleDateString([], dOpts)} · ${daysBetween(sd, ed) + 1} days`
              : (sd ? sd.toLocaleDateString([], dOpts) : 'no date');
            const picked = pickedId === ev.id;
            return (
              <div key={ev.id} onClick={() => onPick(ev)}
                   style={{display:'flex', gap:'0.6rem', padding:'0.5rem 0.4rem',
                           borderBottom:'1px solid var(--border)', cursor:'pointer',
                           background: picked ? 'rgba(218,170,0,0.10)' : 'transparent'}}>
                <div style={{width:'5px', flex:'none', borderRadius:'3px',
                             background:maintColor(ev.event_type)}} />
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', flexWrap:'wrap', gap:'0.4rem', alignItems:'center'}}>
                    <span style={{display:'inline-block', padding:'0.1rem 0.4rem', borderRadius:'999px',
                                  fontSize:'0.7rem', fontWeight:700, color:'#000',
                                  background:maintColor(ev.event_type)}}>
                      {maintLabel(ev.event_type)}
                    </span>
                    <span style={{fontSize:'0.82rem', fontWeight:600}}>{ev.instrument || 'unknown instrument'}</span>
                    <span style={{fontSize:'0.78rem', color:'var(--muted)'}}>{span}</span>
                    {ev.share_community
                      ? <span style={{fontSize:'0.68rem', color:'var(--pass)'}}>shared with community</span>
                      : null}
                  </div>
                  {ev.notes && (
                    <div style={{fontSize:'0.8rem', marginTop:'0.15rem', wordBreak:'break-word'}}>{ev.notes}</div>
                  )}
                  <div style={{fontSize:'0.7rem', color:'var(--muted)', marginTop:'0.15rem'}}>
                    {ev.operator ? `worked by ${ev.operator} · ` : ''}{loggedByText(ev)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /* Mark-downtime form. Downtime-first, but every event type is here so
       this is also the one place to log a source clean for an instrument
       you are not currently looking at in Trends. */
    function MarkDowntimeForm({ instruments, sync, onSaved }) {
      const [open, setOpen] = useState(false);
      const [instrument, setInstrument] = useState('');
      const [eventType, setEventType] = useState('downtime');
      const [startDate, setStartDate] = useState(localDay(new Date()));
      const [endDate, setEndDate] = useState(localDay(new Date()));
      const [notes, setNotes] = useState('');
      const [operator, setOperator] = useState('');
      const [firstRun, setFirstRun] = useState('');
      const [columnId, setColumnId] = useState('');
      const [colLot, setColLot] = useState('');
      const [colOtherVendor, setColOtherVendor] = useState('');
      const [colOtherModel, setColOtherModel] = useState('');
      const [share, setShare] = useState(false);
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState(null);   // {kind:'ok'|'err'|'auth', msg, loginUrl}

      useEffect(() => {
        if (!instrument && instruments.length) setInstrument(instruments[0]);
      }, [instruments]);

      const isDowntime = eventType === 'downtime';
      const isColumnChange = eventType === 'column_change';
      /* Catalogue of columns the lab installs, from config/columns.yml.
         Empty list is fine and expected for an uncatalogued lab -- the
         'Other' branch keeps the form usable either way. */
      const { data: colCat } = useFetch('/api/columns', []);
      const catalogue = (colCat && colCat.columns) || [];
      const pickedCol = catalogue.find(c => c.id === columnId) || null;
      const colIsOther = columnId === '__other__';
      const readonly = !!(sync && sync.readonly);

      const inputStyle = {
        width: '100%', padding: '0.35rem 0.5rem', background: 'var(--bg)',
        color: 'var(--text)', border: '1px solid var(--border)', borderRadius: '0.35rem',
        fontSize: '0.8rem', marginTop: '0.25rem',
      };
      const labelStyle = {fontSize: '0.75rem', color: 'var(--muted)'};

      async function submit() {
        if (!instrument) { setStatus({kind:'err', msg:'Pick an instrument.'}); return; }
        if (!startDate) { setStatus({kind:'err', msg:'A start date is required.'}); return; }
        if (isDowntime && endDate && endDate < startDate) {
          setStatus({kind:'err', msg:'End date is before the start date.'});
          return;
        }
        setBusy(true);
        setStatus({kind:'ok', msg:'Saving…'});
        /* Noon-UTC suffix, same as the Trends log form: the server only
           ever reads the YYYY-MM-DD prefix, and noon keeps that prefix
           equal to the day the operator picked in every timezone. */
        const payload = {
          event_type: eventType,
          event_date: startDate + 'T12:00:00Z',
          end_date: isDowntime && endDate ? endDate + 'T12:00:00Z' : null,
          notes,
          operator,
          first_run: isColumnChange ? (firstRun || null) : null,
          /* Vendor/model come from the catalogue so the same column is spelled
             the same way every time -- per-column history and the expected
             pressure-per-flow table both key on it. Serial carries the LOT,
             which differs between two columns of the same part number. */
          column_vendor: isColumnChange
            ? (colIsOther ? (colOtherVendor || null) : (pickedCol ? pickedCol.vendor : null))
            : null,
          column_model: isColumnChange
            ? (colIsOther ? (colOtherModel || null) : (pickedCol ? pickedCol.model : null))
            : null,
          column_serial: isColumnChange ? (colLot || null) : null,
          share_community: share,
        };
        try {
          const r = await fetch(API + `/api/instruments/${encodeURIComponent(instrument)}/events`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          });
          if (r.status === 403) {
            /* Hosted dashboard, no signed-in operator. The gate hands back
               a login_url precisely so this is a door, not a dead end. */
            let body = {};
            try { body = await r.json(); } catch (e) { body = {}; }
            setStatus({
              kind: 'auth',
              msg: typeof body.detail === 'string'
                ? body.detail
                : 'Recording maintenance needs a signed-in operator.',
              loginUrl: safeLoginUrl(body.login_url || (sync && sync.login_url)),
            });
            setBusy(false);
            return;
          }
          if (!r.ok) {
            let body = {};
            try { body = await r.json(); } catch (e) { body = {}; }
            const detail = typeof body.detail === 'string' ? body.detail : `HTTP ${r.status}`;
            setStatus({kind:'err', msg: detail});
            setBusy(false);
            return;
          }
          setStatus({kind:'ok', msg:'Logged.'});
          setNotes('');
          setBusy(false);
          if (onSaved) onSaved();
          setTimeout(() => { setStatus(null); setOpen(false); }, 1200);
        } catch (e) {
          setStatus({kind:'err', msg: String(e.message || e)});
          setBusy(false);
        }
      }

      if (readonly) {
        return (
          <div style={{padding:'0.75rem', border:'1px solid var(--border)', borderRadius:'0.5rem',
                       background:'var(--bg)', marginBottom:'0.75rem'}}>
            <div style={{fontSize:'0.85rem', color:'var(--muted)', marginBottom:'0.6rem'}}>
              Recording downtime acts on the lab's behalf and is attributed to you, so it
              needs a signed-in operator. The calendar itself is public.
            </div>
            {sync.can_sign_in && (
              <a href={safeLoginUrl(sync.login_url)}
                 style={{display:'inline-block', padding:'0.5rem 1rem', fontSize:'0.85rem',
                         fontWeight:600, borderRadius:'0.4rem', background:'var(--accent)',
                         color:'var(--bg)', textDecoration:'none'}}>
                Sign in to mark downtime
              </a>
            )}
            {sync.signed_in_as && (
              <div style={{fontSize:'0.75rem', color:'var(--muted)', marginTop:'0.5rem'}}>
                Signed in as {sync.signed_in_as}, but not on this dashboard's operator list.
              </div>
            )}
          </div>
        );
      }

      return (
        <div style={{marginBottom:'0.75rem'}}>
          <button onClick={() => setOpen(!open)}
                  style={{padding:'0.35rem 0.8rem', fontSize:'0.8rem'}}>
            {open ? 'Cancel' : '+ Mark downtime'}
          </button>
          {open && (
            <div style={{marginTop:'0.6rem', padding:'0.75rem', background:'var(--bg)',
                         border:'1px solid var(--border)', borderRadius:'0.5rem'}}>
              <div style={{display:'flex', gap:'0.4rem', flexWrap:'wrap', marginBottom:'0.4rem'}}>
                <div style={{flex:'2 1 180px'}}>
                  <label style={labelStyle}>Instrument</label>
                  {instruments.length ? (
                    <select value={instrument} onChange={e => setInstrument(e.target.value)}
                            style={{...inputStyle, cursor:'pointer'}}>
                      {instruments.map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                  ) : (
                    <input value={instrument} onChange={e => setInstrument(e.target.value)}
                           placeholder="Instrument name" style={inputStyle} />
                  )}
                </div>
                <div style={{flex:'1 1 140px'}}>
                  <label style={labelStyle}>What happened</label>
                  <select value={eventType} onChange={e => setEventType(e.target.value)}
                          style={{...inputStyle, cursor:'pointer'}}>
                    <option value="downtime">Downtime (instrument unavailable)</option>
                    <option value="column_change">Column change</option>
                    <option value="column_clog">Column clog / overpressure</option>
                    <option value="capillary_change">Glass capillary change</option>
                    <option value="source_clean">Source clean</option>
                    <option value="calibration">Calibration</option>
                    <option value="lc_service">LC service</option>
                    <option value="pm">PM (preventive maintenance)</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>
              <div style={{display:'flex', gap:'0.4rem', flexWrap:'wrap', marginBottom:'0.4rem'}}>
                <div style={{flex:'1 1 140px'}}>
                  <label style={labelStyle}>{isDowntime ? 'Down from' : 'Date'}</label>
                  <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)}
                         style={inputStyle} />
                </div>
                {isDowntime && (
                  <div style={{flex:'1 1 140px'}}>
                    <label style={labelStyle}>Back up on</label>
                    <input type="date" value={endDate} min={startDate}
                           onChange={e => setEndDate(e.target.value)} style={inputStyle} />
                    <div style={{fontSize:'0.68rem', color:'var(--muted)', marginTop:'0.15rem'}}>
                      Inclusive. Leave equal to the start for a single lost day.
                    </div>
                  </div>
                )}
                <div style={{flex:'1 1 140px'}}>
                  <label style={labelStyle}>Operator</label>
                  <input value={operator} onChange={e => setOperator(e.target.value)}
                         placeholder="Who did the work" style={inputStyle} />
                </div>
              </div>
              {/* Ground truth for the Evosep column-health analysis. Inferring
                  the install point from the pressure series alone produced
                  three different answers for one swap (2026-08-19, 2026-09-01,
                  actual 2026-07-31) depending on the window extracted, so the
                  operator naming the first run is what makes column age and
                  wear trustworthy rather than merely plausible. */}
              {isColumnChange && (
                <div style={{display:'flex', gap:'0.4rem', flexWrap:'wrap', marginBottom:'0.5rem'}}>
                  <div style={{flex:'2 1 240px'}}>
                    <label style={labelStyle}>Column installed</label>
                    <select value={columnId} onChange={e => setColumnId(e.target.value)}
                            style={inputStyle}>
                      <option value="">— pick a column —</option>
                      {catalogue.map(c => (
                        <option key={c.id} value={c.id}>
                          {[c.vendor, c.model].filter(Boolean).join(' · ')}
                        </option>
                      ))}
                      <option value="__other__">Other (type it below)</option>
                    </select>
                    <div style={{fontSize:'0.68rem', color:'var(--muted)', marginTop:'0.15rem'}}>
                      Add new columns to <code>config/columns.yml</code> — hot-reloaded, no deploy.
                    </div>
                  </div>
                  <div style={{flex:'1 1 140px'}}>
                    <label style={labelStyle}>LOT / serial</label>
                    <input value={colLot} onChange={e => setColLot(e.target.value)}
                           placeholder="e.g. 0000507372" style={inputStyle} />
                  </div>
                </div>
              )}
              {isColumnChange && colIsOther && (
                <div style={{display:'flex', gap:'0.4rem', flexWrap:'wrap', marginBottom:'0.5rem'}}>
                  <div style={{flex:'1 1 140px'}}>
                    <label style={labelStyle}>Vendor</label>
                    <input value={colOtherVendor} onChange={e => setColOtherVendor(e.target.value)}
                           placeholder="e.g. IonOpticks" style={inputStyle} />
                  </div>
                  <div style={{flex:'2 1 200px'}}>
                    <label style={labelStyle}>Model</label>
                    <input value={colOtherModel} onChange={e => setColOtherModel(e.target.value)}
                           placeholder="e.g. Aurora 25cm x 75um, 1.6um" style={inputStyle} />
                  </div>
                </div>
              )}
              {isColumnChange && (
                <div style={{marginBottom:'0.5rem'}}>
                  <label style={labelStyle}>First run on the new column</label>
                  <input value={firstRun} onChange={e => setFirstRun(e.target.value)}
                         placeholder="run number or run name — e.g. 24040" style={inputStyle} />
                  <div style={{fontSize:'0.68rem', color:'var(--muted)', marginTop:'0.15rem'}}>
                    Lets the Evosep pressure log verify the swap instead of guessing at it.
                  </div>
                </div>
              )}
              <div style={{marginBottom:'0.5rem'}}>
                <label style={labelStyle}>Notes</label>
                <input value={notes} onChange={e => setNotes(e.target.value)}
                       placeholder="e.g. TIMS cartridge replaced, waiting on part" style={inputStyle} />
              </div>
              {/* Opt-in, default off: maintenance notes routinely name people
                  and customers, and nothing should reach a public leaderboard
                  because a checkbox was pre-ticked. */}
              <label style={{display:'flex', gap:'0.4rem', alignItems:'flex-start',
                             fontSize:'0.75rem', color:'var(--muted)', marginBottom:'0.6rem'}}>
                <input type="checkbox" checked={share} onChange={e => setShare(e.target.checked)}
                       style={{marginTop:'0.15rem'}} />
                <span>
                  Share with the community reliability leaderboard.
                  <strong style={{color:'var(--warn)'}}> Off by default</strong> — notes can name
                  customers, so only tick this if this entry is safe to publish.
                </span>
              </label>
              <button onClick={submit} disabled={busy}
                      style={{padding:'0.35rem 0.8rem', fontSize:'0.8rem', opacity: busy ? 0.6 : 1}}>
                {busy ? 'Saving…' : 'Save'}
              </button>
              {status && status.kind !== 'auth' && (
                <span style={{marginLeft:'0.6rem', fontSize:'0.8rem',
                              color: status.kind === 'err' ? 'var(--fail)' : 'var(--pass)'}}>
                  {status.msg}
                </span>
              )}
              {status && status.kind === 'auth' && (
                <div style={{marginTop:'0.6rem', fontSize:'0.8rem', color:'var(--warn)'}}>
                  {status.msg}{' '}
                  <a href={status.loginUrl} style={{color:'var(--accent)', fontWeight:600}}>Sign in</a>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ===== Bruker acquisition-health panel (maintenance tab) =====
/* ===========================================================================
 * STAN integration snippet  --  Bruker acquisition-health panel (React)
 *
 * Matches STAN's existing frontend patterns: React 18 UMD + in-browser Babel,
 * the `useFetch(url, deps)` helper, `className="card"`, and the theme CSS
 * variables (--surface, --border, --accent, --muted, --text, --pass/--warn/--fail).
 *
 * The three data hues (blue/orange/aqua) are the dataviz-skill-validated dark
 * categorical slots 1-3; they pass CVD + contrast on STAN's navy surface.
 * Plate status uses STAN's own --pass/--fail/--warn AND a glyph + legend, so
 * status never rides on colour alone (red/green are indistinguishable to
 * ~8% of viewers).
 *
 * WHERE TO PASTE
 *   1. Drop this whole block in index.html just ABOVE `function MaintenanceTab()`
 *      (search for that string; it's ~line 4575).
 *   2. Inside MaintenanceTab's returned JSX, render <BrukerAcquisitionPanel />
 *      near the end of the return -- currently below <EvosepColumnPanel />,
 *      which sits above it because the column fails more often than the MS.
 * ======================================================================== */

const BRK = {
  s1: '#3987e5',   // blue   -- throughput completed, method usage
  s2: '#d95926',   // orange -- failure taxonomy
  s3: '#199e70',   // aqua   -- duty cycle
  pass: 'var(--pass)', fail: 'var(--fail)', warn: 'var(--warn)',
  grid: 'var(--border)', ink: 'var(--text)', mut: 'var(--muted)', faint: '#7f97b5',
};
const bFmt = n => (n == null ? '–' : Number(n).toLocaleString('en-US'));
const B_ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const bCatClass = c => ({
  'Evotip missing / not picked up': { bg: 'rgba(217,89,38,.18)', fg: '#f3b79b' },
  'LC pressure / clog': { bg: 'rgba(250,178,25,.16)', fg: '#f6d68a' },
  'MS / acquisition software error': { bg: 'rgba(57,135,229,.16)', fg: '#a9ccf6' },
  'Connection lost': { bg: 'rgba(147,133,233,.18)', fg: '#c9c0f4' },
}[c] || { bg: 'rgba(160,180,204,.15)', fg: 'var(--muted)' });

function BrukerAcquisitionPanel() {
  const { data, loading, error } = useFetch('/api/maintenance/bruker', []);
  if (loading) return <div className="card"><h3>Bruker instrument health</h3>
    <p style={{ color: 'var(--muted)' }}>Loading acquisition history…</p></div>;
  // 404 = extractor hasn't run yet: hide the panel rather than shout.
  if (error) return null;
  if (!data || !data.summary) return null;
  const s = data.summary, idle = data.idle || {};
  const utilPct = s.span_days ? Math.round(100 * s.active_days / s.span_days) : 0;
  const tiles = [
    ['Acquisitions', bFmt(s.total_runs), `${bFmt(s.span_days)} days on record`],
    ['Success rate', `${s.success_rate_pct}%`, `${bFmt((s.failed || 0) + (s.aborted || 0))} failed / aborted`],
    ['Failed runs', bFmt((s.failed || 0) + (s.aborted || 0)), `${(100 - s.success_rate_pct).toFixed(1)}% of all runs`],
    ['Median runtime', `${s.median_run_min} min`, 'per completed acquisition'],
    ['Days in use', bFmt(s.active_days), `${utilPct}% of calendar days`],
    ['Longest idle gap', `${idle.longest_gap_days} d`, `${idle.longest_gap_start} → ${idle.longest_gap_end}`],
  ];
  const inst = data.instrument || {};
  return (
    <div>
      <div className="card">
        <h3>Bruker instrument health</h3>
        <p style={{ color: 'var(--muted)', fontSize: '0.85rem', marginBottom: '0.8rem' }}>
          Acquisition history for station <b style={{ color: 'var(--text)' }}>{inst.name}</b> from
          the Bruker Compass Server database ({s.first_run} → {String(s.last_run).slice(0, 10)}).
          Snapshot {data.backup_date}. Read-only — the dashboard never touches the instrument DB.
        </p>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: '0.7rem' }}>
          {tiles.map(([l, v, n]) => (
            <div key={l} style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: '0.6rem', padding: '0.7rem 0.8rem' }}>
              <div style={{ color: 'var(--muted)', fontSize: '0.72rem', textTransform: 'uppercase', letterSpacing: '.4px' }}>{l}</div>
              <div style={{ fontSize: '1.5rem', fontWeight: 650, marginTop: '.1rem' }}>{v}</div>
              <div style={{ color: '#7f97b5', fontSize: '0.72rem', marginTop: '.15rem' }}>{n}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(340px,1fr))', gap: '1rem' }}>
        <BThroughput months={data.throughput_monthly || []} />
        <BDuty months={data.utilization_monthly || []} />
      </div>

      <BPlate plate={data.latest_plate || {}} />

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(340px,1fr))', gap: '1rem' }}>
        <BFailBars cats={data.failures_by_category || []} first={s.first_run} />
        <BMethodBars methods={data.methods || []} />
      </div>

      <BFailTable rows={(data.failures_recent || []).slice(0, 12)} />
    </div>
  );
}

function BLegend({ items }) {
  return <div style={{ display: 'flex', flexWrap: 'wrap', gap: '.9rem', fontSize: '.8rem', color: 'var(--muted)', margin: '.1rem 0 .5rem' }}>
    {items.map(([c, l]) => <span key={l} style={{ display: 'inline-flex', alignItems: 'center', gap: '.35rem' }}>
      <span style={{ width: '.75rem', height: '.75rem', borderRadius: 2, background: c, display: 'inline-block' }} />{l}</span>)}
  </div>;
}

/* ---- monthly throughput: stacked columns, completed (blue) + failed (red) ---- */
function BThroughput({ months }) {
  const data = months.slice(-24);
  const W = 560, H = 220, L = 44, R = 12, T = 10, B = 34, iw = W - L - R, ih = H - T - B;
  const max = Math.max(1, ...data.map(d => d.total)) * 1.08;
  const step = iw / Math.max(data.length, 1), bw = Math.min(22, step * 0.66);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => max * f);
  return (
    <div className="card">
      <h3>Monthly acquisition throughput</h3>
      <p style={{ color: 'var(--muted)', fontSize: '.82rem', margin: '0 0 .6rem' }}>Completed and failed runs per month (last {data.length}). Hover for counts.</p>
      <BLegend items={[[BRK.s1, 'Completed'], [BRK.fail, 'Failed / aborted']]} />
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', overflow: 'visible' }}>
        {ticks.map((v, i) => { const y = T + ih - ih * (v / max); return <g key={i}>
          <line x1={L} y1={y} x2={L + iw} y2={y} stroke="var(--border)" strokeWidth="1" />
          <text x={L - 8} y={y + 3.5} textAnchor="end" fill="#7f97b5" fontSize="11">{Math.round(v).toLocaleString()}</text>
        </g>; })}
        {data.map((d, i) => {
          const cx = L + step * i + step / 2, x = cx - bw / 2;
          const hTot = ih * (d.total / max), hFail = ih * (d.failed / max), yTot = T + ih - hTot;
          return <g key={i}>
            {hTot - hFail > 0 && <rect x={x} y={yTot + hFail} width={bw} height={hTot - hFail} rx="2" fill={BRK.s1} />}
            {hFail > 0 && <rect x={x} y={yTot} width={bw} height={Math.max(hFail - 1, 1.5)} rx="2" fill={BRK.fail} />}
            <rect x={x - step * 0.17} y={T} width={step * 0.9} height={ih} fill="transparent">
              <title>{`${d.month}\nTotal ${bFmt(d.total)} · completed ${bFmt(d.done)} · failed ${bFmt(d.failed)}`}</title>
            </rect>
            {(i % 3 === 0 || i === data.length - 1) && <text x={cx} y={H - B + 16} textAnchor="middle" fill="#7f97b5" fontSize="11">{d.month.slice(2)}</text>}
          </g>;
        })}
      </svg>
    </div>
  );
}

/* ---- duty cycle line (aqua) ---- */
function BDuty({ months }) {
  const data = months.slice(-24);
  if (!data.length) return null;
  const W = 560, H = 200, L = 40, R = 14, T = 10, B = 32, iw = W - L - R, ih = H - T - B;
  const max = Math.max(10, ...data.map(d => d.duty_pct)) * 1.12;
  const step = iw / Math.max(data.length - 1, 1);
  const pts = data.map((d, i) => [L + step * i, T + ih - ih * (d.duty_pct / max)]);
  const area = `M${pts[0][0]},${T + ih} ` + pts.map(p => `L${p[0]},${p[1]}`).join(' ') + ` L${pts[pts.length - 1][0]},${T + ih} Z`;
  const last = pts[pts.length - 1];
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => max * f);
  return (
    <div className="card">
      <h3>Instrument duty cycle</h3>
      <p style={{ color: 'var(--muted)', fontSize: '.82rem', margin: '0 0 .6rem' }}>Share of each month's hours spent acquiring (run time ÷ hours in month).</p>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', overflow: 'visible' }}>
        {ticks.map((v, i) => { const y = T + ih - ih * (v / max); return <g key={i}>
          <line x1={L} y1={y} x2={L + iw} y2={y} stroke="var(--border)" strokeWidth="1" />
          <text x={L - 8} y={y + 3.5} textAnchor="end" fill="#7f97b5" fontSize="11">{Math.round(v)}%</text>
        </g>; })}
        <path d={area} fill={BRK.s3} fillOpacity="0.12" />
        <polyline points={pts.map(p => p.join(',')).join(' ')} fill="none" stroke={BRK.s3} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        <circle cx={last[0]} cy={last[1]} r="4" fill={BRK.s3} stroke="var(--surface)" strokeWidth="2" />
        <text x={last[0] - 4} y={last[1] - 9} textAnchor="end" fill="var(--text)" fontSize="11" fontWeight="600">{data[data.length - 1].duty_pct}%</text>
        {data.map((d, i) => <g key={i}>
          <rect x={pts[i][0] - step / 2} y={T} width={step} height={ih} fill="transparent">
            <title>{`${d.month}\nDuty ${d.duty_pct}% · ${d.active_days} active days · ${bFmt(d.runs)} runs`}</title>
          </rect>
          {(i % 3 === 0 || i === data.length - 1) && <text x={pts[i][0]} y={H - B + 16} textAnchor="middle" fill="#7f97b5" fontSize="11">{d.month.slice(2)}</text>}
        </g>)}
      </svg>
    </div>
  );
}

/* ---- latest 96-well plate, status by glyph + colour ---- */
function BPlate({ plate }) {
  const wells = plate.wells || [];
  const byWell = {};
  wells.forEach(w => { const m = (w.well || '').match(/-([A-H])(\d{1,2})$/); if (m) byWell[m[1] + (+m[2])] = w; });
  const fails = wells.filter(w => w.status === 'FAILED' || w.status === 'ABORTED');
  const cell = (cls, glyph, key, tip) => {
    const bg = { pass: 'var(--pass)', fail: 'var(--fail)', run: 'var(--warn)', empty: 'var(--bg)' }[cls];
    return <div key={key} title={tip} style={{
      aspectRatio: '1 / 1', borderRadius: '.32rem', display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: '.7rem', fontWeight: 700, color: cls === 'fail' ? '#fff' : '#04223f', background: bg,
      border: cls === 'empty' ? '1px solid var(--border)' : '1px solid transparent',
      boxShadow: cls === 'fail' ? '0 0 0 2px rgba(239,68,68,.35)' : 'none',
    }}>{glyph}</div>;
  };
  return (
    <div className="card">
      <h3>Latest plate — {plate.date}</h3>
      <p style={{ color: 'var(--muted)', fontSize: '.82rem', margin: '0 0 .6rem' }}>
        Plate S5, 96-well layout from the acquisition queue: {plate.n_pass} completed, {plate.n_fail} failed.
      </p>
