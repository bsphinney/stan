      <BLegend items={[['var(--pass)', 'Completed ✓'], ['var(--fail)', 'Failed ✗'], ['var(--warn)', 'Running ◐'], ['var(--bg)', 'No run']]} />
      <div style={{ display: 'grid', gridTemplateColumns: '1.4rem repeat(12,1fr)', gap: 4, maxWidth: 640 }}>
        <div />
        {Array.from({ length: 12 }, (_, i) => <div key={'h' + i} style={{ textAlign: 'center', color: '#7f97b5', fontSize: '.72rem' }}>{i + 1}</div>)}
        {B_ROWS.map(r => [
          <div key={'r' + r} style={{ display: 'flex', alignItems: 'center', color: '#7f97b5', fontSize: '.72rem' }}>{r}</div>,
          ...Array.from({ length: 12 }, (_, c) => {
            const w = byWell[r + (c + 1)];
            if (!w) return cell('empty', '', r + '-' + c, `${r}${c + 1} — no run`);
            const cls = w.status === 'DONE' ? 'pass' : w.status === 'RUNNING' ? 'run' : 'fail';
            const glyph = cls === 'pass' ? '✓' : cls === 'run' ? '◐' : '✗';
            const tip = `${w.well} · ${w.sample || '—'}\n${w.status}${w.status !== 'DONE' ? '\n' + w.message : ''}`;
            return cell(cls, glyph, r + '-' + c, tip);
          }),
        ])}
      </div>
      {fails.length > 0 && (
        <div style={{ background: 'rgba(239,68,68,.08)', borderLeft: '3px solid var(--fail)', padding: '.6rem .8rem', borderRadius: '.35rem', fontSize: '.86rem', marginTop: '.8rem', color: '#f3c2c2' }}>
          {fails.length} well{fails.length > 1 ? 's' : ''} produced no usable data file:{' '}
          {fails.map((w, i) => <span key={i}><b style={{ color: 'var(--text)' }}>{w.well}</b> ({w.sample}){i < fails.length - 1 ? ', ' : ''}</span>)}.
          {' '}Reason parsed from the instrument: <b>{fails[0].category}</b>. Reload the tip(s) and re-queue just these wells.
        </div>
      )}
    </div>
  );
}

/* ---- failure taxonomy (orange bars) ---- */
function BFailBars({ cats, first }) {
  const data = [...cats].sort((a, b) => b.count - a.count);
  const total = data.reduce((a, d) => a + d.count, 0) || 1;
  const W = 560, rowH = 34, H = 12 + data.length * rowH, barX = 210, barMax = W - barX - 46;
  const max = Math.max(1, ...data.map(d => d.count));
  const top = data[0];
  return (
    <div className="card">
      <h3>Why acquisitions fail</h3>
      <p style={{ color: 'var(--muted)', fontSize: '.82rem', margin: '0 0 .6rem' }}>Every failed / aborted run since {first}, grouped by root cause from the instrument error text.</p>
      {top && <div style={{ background: 'rgba(217,89,38,.08)', borderLeft: '3px solid ' + BRK.s2, padding: '.6rem .8rem', borderRadius: '.35rem', fontSize: '.86rem', margin: '0 0 .8rem', color: '#f2d9cc' }}>
        <b style={{ color: 'var(--text)' }}>{top.category}</b> is the dominant failure mode — {bFmt(top.count)} runs ({Math.round(100 * top.count / total)}%). A consumable / loading issue on the Evosep, not an MS fault.
      </div>}
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', overflow: 'visible' }}>
        {data.map((d, i) => {
          const y = 6 + i * rowH + rowH / 2, bw = Math.max(barMax * (d.count / max), 2);
          return <g key={i}>
            <text x={0} y={y + 4} fill="var(--muted)" fontSize="11">{d.category}</text>
            <rect x={barX} y={y - 9} width={bw} height={18} rx="3" fill={BRK.s2} />
            <text x={barX + bw + 7} y={y + 4} fill="var(--text)" fontSize="11" fontWeight="600">{bFmt(d.count)}</text>
            <rect x={0} y={y - rowH / 2} width={W} height={rowH} fill="transparent"><title>{`${d.category}: ${bFmt(d.count)} (${Math.round(100 * d.count / total)}%)`}</title></rect>
          </g>;
        })}
      </svg>
    </div>
  );
}

/* ---- method / gradient usage (blue bars) ---- */
function BMethodBars({ methods }) {
  const data = methods.filter(m => m.count >= 5).sort((a, b) => b.count - a.count);
  const W = 560, rowH = 34, H = 12 + data.length * rowH, barX = 150, barMax = W - barX - 52;
  const max = Math.max(1, ...data.map(d => d.count));
  return (
    <div className="card">
      <h3>Gradient / method usage</h3>
      <p style={{ color: 'var(--muted)', fontSize: '.82rem', margin: '0 0 .6rem' }}>Runs by Evosep gradient (samples-per-day), parsed from filenames. "other/unspecified" = washes, blanks and legacy names.</p>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', overflow: 'visible' }}>
        {data.map((d, i) => {
          const y = 6 + i * rowH + rowH / 2, bw = Math.max(barMax * (d.count / max), 2);
          const fr = d.count ? (100 * d.failed / d.count) : 0;
          return <g key={i}>
            <text x={0} y={y + 4} fill="var(--muted)" fontSize="11">{d.method}</text>
            <rect x={barX} y={y - 9} width={bw} height={18} rx="3" fill={BRK.s1} />
            <text x={barX + bw + 7} y={y + 4} fill="var(--text)" fontSize="11" fontWeight="600">{bFmt(d.count)}</text>
            <rect x={0} y={y - rowH / 2} width={W} height={rowH} fill="transparent"><title>{`${d.method}: ${bFmt(d.count)} runs · ${bFmt(d.failed)} failed (${fr.toFixed(1)}%)`}</title></rect>
          </g>;
        })}
      </svg>
    </div>
  );
}

/* ---- recent failures table ---- */
function BFailTable({ rows }) {
  return (
    <div className="card">
      <h3>Most recent failures</h3>
      <p style={{ color: 'var(--muted)', fontSize: '.82rem', margin: '0 0 .6rem' }}>Newest {rows.length} failed / aborted acquisitions with the raw instrument message.</p>
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '.82rem' }}>
          <thead><tr>{['When', 'Well', 'Sample', 'Cause', 'Message'].map(hh =>
            <th key={hh} style={{ textAlign: 'left', padding: '.45rem .55rem', borderBottom: '1px solid var(--border)', color: 'var(--muted)', fontSize: '.72rem', textTransform: 'uppercase', letterSpacing: '.3px' }}>{hh}</th>)}</tr></thead>
          <tbody>
            {rows.map((r, i) => {
              const sm = (r.fname || '').match(/(?:^|_)([A-Za-z0-9:.+-]+)_S\d+-[A-H]\d/);
              const cc = bCatClass(r.category);
              return <tr key={i}>
                <td style={{ padding: '.45rem .55rem', borderBottom: '1px solid var(--border)', fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '.78rem', color: 'var(--muted)', whiteSpace: 'nowrap' }}>{r.start_date}</td>
                <td style={{ padding: '.45rem .55rem', borderBottom: '1px solid var(--border)', fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '.78rem', color: 'var(--muted)' }}>{r.well || '—'}</td>
                <td style={{ padding: '.45rem .55rem', borderBottom: '1px solid var(--border)' }}>{sm ? sm[1] : '—'}</td>
                <td style={{ padding: '.45rem .55rem', borderBottom: '1px solid var(--border)' }}>
                  <span style={{ display: 'inline-block', fontSize: '.72rem', fontWeight: 600, padding: '.1rem .45rem', borderRadius: '.8rem', background: cc.bg, color: cc.fg, whiteSpace: 'nowrap' }}>{r.category}</span>
                </td>
                <td style={{ padding: '.45rem .55rem', borderBottom: '1px solid var(--border)', fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '.76rem', color: 'var(--muted)' }}>{r.message}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}
    // ===== end Bruker panel =====

    /* ──────────────────────────────────────────────────────────────────────────
     * Evosep One — column health & clog early warning
     *
     * Paste this whole block into stan/dashboard/public/index.html immediately
     * ABOVE `function MaintenanceTab()`, then render <EvosepColumnPanel /> inside
     * MaintenanceTab's returned JSX.
     *
     * Data: GET /api/maintenance/evosep  (PG Farm first, config JSON fallback).
     * Uses STAN's own useFetch, .card, and theme CSS vars. Charts are inline SVG —
     * no new libraries; Plotly is left untouched.
     *
     * Colour: the three method hues are the dataviz dark categorical slots 1-3,
     * validated all-pairs against STAN's navy surface #022851 (worst CVD ΔE 9.4,
     * worst normal-vision ΔE 20.9, all ≥3:1 contrast). Severity uses STAN's
     * reserved status vars and ALWAYS carries a glyph + text label — warn↔pass
     * fails CVD separation (ΔE 4.2 protan), so colour alone would be unreadable.
     * ────────────────────────────────────────────────────────────────────────── */

    /* Categorical slots 1-3 — assigned to methods in fixed order, never cycled. */
    const EV_HUES = ['#3987e5', '#d95926', '#199e70'];

    const EV_SEV = {
      critical: { color: 'var(--fail)', glyph: '▲', label: 'Critical' },
      elevated: { color: 'var(--warn)', glyph: '◆', label: 'Elevated' },
      ok:       { color: 'var(--pass)', glyph: '●', label: 'Normal'   },
    };

    function evFmtDate(s) {
      if (!s) return '—';
      return String(s).replace('T', ' ').slice(0, 16);
    }
    function evNum(v, d = 0) {
      return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(d);
    }

    /* Severity chip: colour + glyph + word. Never colour alone. */
    function EvBadge({ sev }) {
      const s = EV_SEV[sev] || EV_SEV.ok;
      return (
        <span style={{
          display: 'inline-flex', alignItems: 'center', gap: '0.3rem',
          color: s.color, fontSize: '0.78rem', fontWeight: 600, whiteSpace: 'nowrap',
        }}>
          <span aria-hidden="true">{s.glyph}</span>{s.label}
        </span>
      );
    }

    /* A headline number with its unit and a one-line explanation. */
    function EvTile({ label, value, unit, note, tone }) {
      return (
        <div style={{
          background: 'var(--bg)', border: '1px solid var(--border)',
          borderRadius: '0.5rem', padding: '0.6rem 0.75rem', flex: '1 1 150px',
          minWidth: '140px',
        }}>
          <div style={{ color: 'var(--muted)', fontSize: '0.72rem', marginBottom: '0.2rem' }}>
            {label}
          </div>
          <div style={{ fontSize: '1.35rem', fontWeight: 700, color: tone || 'var(--text)', lineHeight: 1.1 }}>
            {value}
            {unit && <span style={{ fontSize: '0.8rem', fontWeight: 400, color: 'var(--muted)' }}> {unit}</span>}
          </div>
          {note && <div style={{ color: 'var(--muted)', fontSize: '0.7rem', marginTop: '0.2rem' }}>{note}</div>}
        </div>
      );
    }

    /* ── Chart A ───────────────────────────────────────────────────────────────
     * Column backpressure per run, one small multiple per analytical method.
     * Separate charts (never a shared/dual y-axis): a 100 spd and a 60 spd
     * gradient run at genuinely different pressures, so overlaying them on one
     * scale would compare nothing.
     * ────────────────────────────────────────────────────────────────────────── */
    function EvBaselineChart({ method, ms, hue, flagsByRun }) {
      const series = ms.series || [];
      if (series.length < 2) return null;

      const W = 1000, H = 150, PADL = 46, PADR = 12, PADT = 12, PADB = 20;
      const times = series.map(p => new Date(p.start).getTime());
      const vals = series.map(p => p.plateau_bar);
      const t0 = Math.min(...times), t1 = Math.max(...times);
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const pad = Math.max(4, (hi - lo) * 0.12);
      const yLo = lo - pad, yHi = hi + pad;

      const X = t => PADL + ((t - t0) / ((t1 - t0) || 1)) * (W - PADL - PADR);
      const Y = v => PADT + (1 - (v - yLo) / ((yHi - yLo) || 1)) * (H - PADT - PADB);

      const path = series
        .map((p, i) => `${i ? 'L' : 'M'}${X(times[i]).toFixed(1)},${Y(p.plateau_bar).toFixed(1)}`)
        .join(' ');

      const base = ms.baseline_bar;
      const ticks = [yLo, (yLo + yHi) / 2, yHi];

      /* Sustained downward steps are candidate interventions — a new column, a
         wash, a seal service. They are what a rising baseline should be measured
         from, so they are drawn as rules rather than hidden. */
      const drops = (ms.steps || []).filter(s => s.direction === 'drop');

      return (
        <div style={{ marginBottom: '0.5rem' }}>
          <div style={{
            display: 'flex', alignItems: 'baseline', gap: '0.5rem',
            flexWrap: 'wrap', marginBottom: '0.15rem',
          }}>
            {/* Direct label — identity never rides on the line colour alone. */}
            <span style={{ color: hue, fontWeight: 700, fontSize: '0.85rem' }}>■ {method}</span>
            <span style={{ color: 'var(--muted)', fontSize: '0.75rem' }}>
              {ms.n_runs} runs · baseline {evNum(base, 0)} bar
              {ms.plateau_sd_bar != null && <> · run-to-run sd {evNum(ms.plateau_sd_bar, 1)} bar</>}
              {ms.trend_bar_per_day != null &&
                <> · trend {ms.trend_bar_per_day > 0 ? '+' : ''}{evNum(ms.trend_bar_per_day, 1)} bar/day</>}
            </span>
          </div>

          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}
               role="img" aria-label={`${method} column backpressure per run`}>
            {ticks.map((v, i) => (
              <g key={i}>
                <line x1={PADL} x2={W - PADR} y1={Y(v)} y2={Y(v)}
                      stroke="var(--border)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                <text x={PADL - 6} y={Y(v) + 3} textAnchor="end"
                      fill="var(--muted)" fontSize="10">{evNum(v, 0)}</text>
              </g>
            ))}

            {/* ±10 % band around the running baseline: the "normal" corridor. */}
            {base && (
              <rect x={PADL} y={Y(base * 1.1)} width={W - PADL - PADR}
                    height={Math.max(1, Y(base * 0.9) - Y(base * 1.1))}
                    fill={hue} opacity="0.10" />
            )}

            {drops.map((s, i) => {
              const x = X(new Date(s.at).getTime());
              return (
                <g key={i}>
                  <line x1={x} x2={x} y1={PADT} y2={H - PADB}
                        stroke="var(--muted)" strokeWidth="1" strokeDasharray="3 3"
                        vectorEffect="non-scaling-stroke" opacity="0.7" />
                  <title>{`Baseline step ${s.change_pct}% at ${evFmtDate(s.at)} — ${s.from_bar} → ${s.to_bar} bar (candidate column change / wash)`}</title>
                </g>
              );
            })}

            <path d={path} fill="none" stroke={hue} strokeWidth="2"
                  vectorEffect="non-scaling-stroke" strokeLinejoin="round" />

            {/* Flagged runs carry a ring + status colour + hover text. */}
            {series.map((p, i) => {
              const f = flagsByRun[p.start];
              if (!f) return null;
              const s = EV_SEV[f.severity] || EV_SEV.elevated;
              return (
                <g key={i}>
                  <circle cx={X(times[i])} cy={Y(p.plateau_bar)} r="4.5"
                          fill={s.color} stroke="var(--surface)" strokeWidth="2"
                          vectorEffect="non-scaling-stroke" />
                  <title>{`${s.label} — ${evFmtDate(p.start)}\n${p.plateau_bar} bar\n${f.reasons.join('\n')}`}</title>
                </g>
              );
            })}

            {/* Invisible per-run hit targets so every point is hoverable. */}
            {series.map((p, i) => (
              <g key={`h${i}`}>
                <circle cx={X(times[i])} cy={Y(p.plateau_bar)} r="7" fill="transparent" />
                <title>{`${evFmtDate(p.start)} — ${p.plateau_bar} bar`}</title>
              </g>
            ))}

            <text x={PADL} y={H - 6} fill="var(--muted)" fontSize="10">
              {evFmtDate(ms.first_run)}
            </text>
            <text x={W - PADR} y={H - 6} textAnchor="end" fill="var(--muted)" fontSize="10">
              {evFmtDate(ms.last_run)}
            </text>
          </svg>
        </div>
      );
    }

    /* ── Chart B ───────────────────────────────────────────────────────────────
     * Anatomy of a clog. One small multiple per run that reached the pump
     * cut-out, each drawn against the ROLLING reference it was actually judged
     * against — the median of the last few clean runs of the same method,
     * interpolated onto absolute minutes.
     *
     * Absolute minutes, not relative: an aborting run is short *because* it
     * failed, so a relative-time axis compresses it and shifts every feature
     * earlier. The extractor aligns on the instrument's real schedule, and this
     * chart draws exactly what it compared.
     * ────────────────────────────────────────────────────────────────────────── */
    function EvClogTrace({ run, ceiling }) {
      const g = run.ref_grid_min, ref = run.ref_curve, mine = run.curve_on_ref_grid;
      if (!g || !ref || !mine) return null;

      const W = 1000, H = 210, PADL = 44, PADR = 118, PADT = 14, PADB = 26;
      const tMax = Math.max(g[g.length - 1], run.duration_min);
      const yHi = ceiling * 1.04;
      const X = t => PADL + (t / tMax) * (W - PADL - PADR);
      const Y = v => PADT + (1 - v / yHi) * (H - PADT - PADB);

      const draw = arr => {
        let d = '', pen = false;
        arr.forEach((v, i) => {
          if (v === null || v === undefined) { pen = false; return; }
          d += `${pen ? 'L' : 'M'}${X(g[i]).toFixed(1)},${Y(v).toFixed(1)}`;
          pen = true;
        });
        return d;
      };

      const bx = run.envelope_breach_min != null ? X(run.envelope_breach_min) : null;
      const yTicks = [0, 130, 260, 390, ceiling];

      return (
        <div style={{ marginBottom: '0.75rem' }}>
          <div style={{ fontSize: '0.8rem', marginBottom: '0.1rem' }}>
            <strong>{evFmtDate(run.start)}</strong>
            <span style={{ color: 'var(--muted)' }}>
              {' · '}{run.method}{' · '}peak {evNum(run.peak_bar, 0)} bar
              {run.envelope_lead_min != null && <>
                {' · '}<span style={{ color: 'var(--accent)' }}>
                  {evNum(run.envelope_lead_min, 1)} min of warning
                </span> before the {run.envelope_lead_to || 'cut-out'}
              </>}
            </span>
          </div>
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}
               role="img" aria-label={`Pressure trace for the run at ${run.start}`}>
            {yTicks.map((v, i) => (
              <g key={i}>
                <line x1={PADL} x2={W - PADR} y1={Y(v)} y2={Y(v)}
                      stroke="var(--border)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                <text x={PADL - 6} y={Y(v) + 3} textAnchor="end" fill="var(--muted)" fontSize="10">{v}</text>
              </g>
            ))}
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <text key={i} x={X(f * tMax)} y={H - 8} textAnchor="middle"
                    fill="var(--muted)" fontSize="10">{(f * tMax).toFixed(0)} min</text>
            ))}

            {/* The window between leaving the reference and the abort — the
                warning this whole feature exists to produce. */}
            {bx !== null && (
              <rect x={bx} y={PADT}
                    width={Math.max(0, X(run.t_ceiling_min != null ? run.t_ceiling_min : run.duration_min) - bx)}
                    height={H - PADT - PADB} fill="var(--accent)" opacity="0.10" />
            )}

            <path d={draw(ref)} fill="none" stroke="var(--muted)" strokeWidth="2"
                  vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
            <path d={draw(mine)} fill="none" stroke="var(--fail)" strokeWidth="2"
                  vectorEffect="non-scaling-stroke" strokeLinejoin="round" />

            <line x1={PADL} x2={W - PADR} y1={Y(ceiling)} y2={Y(ceiling)}
                  stroke="var(--fail)" strokeWidth="2" strokeDasharray="6 4"
                  vectorEffect="non-scaling-stroke" />
            <text x={W - PADR + 6} y={Y(ceiling) + 4} fill="var(--fail)" fontSize="10" fontWeight="600">
              {ceiling} bar cut-out
            </text>

            {bx !== null && (
              <g>
                <line x1={bx} x2={bx} y1={PADT} y2={H - PADB} stroke="var(--accent)"
                      strokeWidth="2" strokeDasharray="4 3" vectorEffect="non-scaling-stroke" />
                <text x={bx + 5} y={PADT + 11} fill="var(--accent)" fontSize="10" fontWeight="600">
                  departs at {evNum(run.envelope_breach_min, 1)} min
                </text>
              </g>
            )}

            {/* Legend — two series, so identity never rides on colour alone. */}
            <g transform={`translate(${W - PADR + 6},${PADT + 24})`}>
              <line x1="0" x2="14" y1="0" y2="0" stroke="var(--muted)" strokeWidth="2" vectorEffect="non-scaling-stroke" />
              <text x="18" y="4" fill="var(--muted)" fontSize="10">expected</text>
              <line x1="0" x2="14" y1="15" y2="15" stroke="var(--fail)" strokeWidth="2" vectorEffect="non-scaling-stroke" />
              <text x="18" y="19" fill="var(--fail)" fontSize="10">this run</text>
            </g>
          </svg>
        </div>
      );
    }

    /* ── Validation ────────────────────────────────────────────────────────────
     * Scores the pressure signal against Compass's own failure log. This is the
     * honesty panel: if the trace did not independently find the known failures,
     * it says so here.
     * ────────────────────────────────────────────────────────────────────────── */
    function EvValidation({ v }) {
      if (!v || !v.available) return null;
      const rows = (v.matched || []).slice().sort((a, b) => (a.compass_time < b.compass_time ? 1 : -1));
      const clogOK = v.clog_failures_detected === v.clog_failures_in_window;
      const tipOK = v.tip_failures_detected === v.tip_failures_in_window;

      return (
        <div style={{ marginTop: '1rem' }}>
          <h4 style={{ fontSize: '0.9rem', color: 'var(--text)', margin: '0 0 0.35rem' }}>
            Does the pressure trace actually catch the failures Compass logged?
          </h4>
          <div style={{ display: 'flex', gap: '0.6rem', flexWrap: 'wrap', marginBottom: '0.6rem' }}>
            <EvTile label="LC clog failures found"
                    value={`${v.clog_failures_detected}/${v.clog_failures_in_window}`}
                    tone={clogOK ? 'var(--pass)' : 'var(--warn)'}
                    note={clogOK ? 'every one, independently' : 'some were missed'} />
            <EvTile label="Evotip failures found"
                    value={`${v.tip_failures_detected}/${v.tip_failures_in_window}`}
                    tone={tipOK ? 'var(--pass)' : 'var(--warn)'}
                    note={tipOK ? 'low-pressure side' : 'some were missed'} />
            <EvTile label="False negatives"
                    value={(v.unmatched_compass_failures || []).length}
                    note="Compass failures with no matching pressure record" />
            <EvTile label="Compass record ends"
                    value={evFmtDate(v.compass_covers_to)}
                    note="pressure logs run later than this" />
          </div>

          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', fontSize: '0.78rem' }}>
              <thead>
                <tr>
                  <th>Compass logged</th><th>Category</th>
                  <th style={{ textAlign: 'right' }}>Peak bar</th>
                  <th style={{ textAlign: 'right' }}>Tip bar</th>
                  <th style={{ textAlign: 'right' }}>Warning</th>
                  <th>Found by pressure</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((m, i) => (
                  <tr key={i}>
                    <td style={{ whiteSpace: 'nowrap' }}>{evFmtDate(m.compass_time)}</td>
                    <td style={{ color: 'var(--muted)' }}>{m.category}</td>
                    <td style={{ textAlign: 'right', color: m.peak_bar >= 515 ? 'var(--fail)' : 'var(--text)' }}>
                      {evNum(m.peak_bar, 0)}
                    </td>
                    <td style={{ textAlign: 'right', color: m.tip_pressure_max_bar >= 60 ? 'var(--fail)' : 'var(--text)' }}>
                      {evNum(m.tip_pressure_max_bar, 0)}
                    </td>
                    <td style={{ textAlign: 'right' }}>
                      {m.envelope_lead_min != null
                        ? <span title="minutes between leaving the healthy envelope and hitting the pump cut-out">
                            {evNum(m.envelope_lead_min, 1)} min
                          </span>
                        : <span style={{ color: 'var(--muted)' }}>—</span>}
                    </td>
                    <td style={{ whiteSpace: 'nowrap' }}>
                      {m.flagged_by_pressure
                        ? <span style={{ color: 'var(--pass)', fontWeight: 600 }}>
                            <span aria-hidden="true">✓ </span>Detected</span>
                        : <span style={{ color: 'var(--fail)', fontWeight: 600 }}>
                            <span aria-hidden="true">✕ </span>Missed</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {(v.silent_critical_excursions || []).length > 0 && (
            <div style={{ color: 'var(--muted)', fontSize: '0.75rem', marginTop: '0.5rem' }}>
              {v.silent_critical_excursions.length} further run(s) inside the Compass-covered
              window ran at critical backpressure without Compass recording any failure —
              they completed, so the error log never mentions them.
            </div>
          )}
        </div>
      );
    }

    /* ── The panel ─────────────────────────────────────────────────────────── */
    function EvosepColumnPanel() {
      const { data, loading, error } = useFetch('/api/maintenance/evosep', []);

      /* Match the Bruker panel: stay invisible until the extractor has produced
         a document, rather than showing an error box on a fresh install. */
      if (loading || error || !data || !data.summary) return null;

      const d = data;
      const col = d.column || {};
      const s = d.summary || {};
      const wear = d.wear || {};
      const flags = d.flags || [];
      const flagsByRun = {};
      flags.forEach(f => { flagsByRun[f.start] = f; });

      const analytical = Object.values(d.methods || {})
        .filter(m => m.analytical)
        .sort((a, b) => b.n_runs - a.n_runs);
      const primary = (d.column && d.column.method) || (analytical[0] && analytical[0].method);

      const rising = col.baseline_change_pct != null && col.baseline_change_pct > 0;
      const recent = flags.slice().sort((a, b) => (a.start < b.start ? 1 : -1)).slice(0, 12);
      /* Runs that reached the pump cut-out and carry the reference they were
         compared against — the ones worth drawing a full trace for. */
      const clogs = (d.runs || [])
        .filter(r => r.ref_curve && r.peak_bar >= (d.ceiling_bar - 5))
        .sort((a, b) => (a.start < b.start ? 1 : -1));

      return (
        <div className="card">
          <h3>Evosep One — column health &amp; clog early warning</h3>
          <div style={{ color: 'var(--muted)', fontSize: '0.8rem', marginBottom: '0.75rem' }}>
            {s.n_runs} procedure runs on {d.instrument_host} ({(d.serials || []).join(', ')}),
            {' '}{evFmtDate(s.first_run)} → {evFmtDate(s.last_run)}. Backpressure is read from
            {' '}<strong>{d.column_pump}</strong>, the analytical-column pump — it runs at
            {' '}300-520 bar and ~1.7 µL/min while the low-pressure pumps A-D stay under 10 bar.
            {' '}Extracted {evFmtDate(d.generated_at)}.
          </div>

          {/* ── Current column state ── */}
          <div style={{ display: 'flex', gap: '0.6rem', flexWrap: 'wrap', marginBottom: '0.9rem' }}>
            <EvTile label="Days on this column" value={evNum(col.days_since, 1)} unit="days"
                    note={col.source === 'logged maintenance event'
                      ? 'since the logged column change'
                      : 'since an inferred baseline drop — no column change logged'} />
            <EvTile label="Injections on column" value={col.injections_since != null ? col.injections_since : '—'}
                    note="from the instrument's own lifetime counter" />
            <EvTile label="Baseline now" value={evNum(col.baseline_now_bar, 0)} unit="bar"
                    note={`was ${evNum(col.baseline_at_install_bar, 0)} bar when installed`} />
            <EvTile label="Baseline change" value={`${rising ? '+' : ''}${evNum(col.baseline_change_pct, 1)}%`}
                    tone={col.baseline_change_pct > 15 ? 'var(--warn)' : 'var(--text)'}
                    note={rising ? 'backpressure is climbing' : 'backpressure is flat or falling'} />
            <EvTile label="Runs at the cut-out" value={s.n_at_ceiling}
                    tone={s.n_at_ceiling ? 'var(--fail)' : 'var(--pass)'}
                    note={`peaked at the ${d.ceiling_bar} bar limit`} />
            <EvTile label="Flagged runs" value={`${s.n_flagged}`}
                    tone={s.n_critical ? 'var(--warn)' : 'var(--text)'}
                    note={`${s.n_critical} critical, of ${s.n_runs} runs`} />
          </div>

          {/* ── Chart A ── */}
          <h4 style={{ fontSize: '0.9rem', color: 'var(--text)', margin: '0 0 0.4rem' }}>
            Column backpressure, run by run
          </h4>
          <div style={{ color: 'var(--muted)', fontSize: '0.75rem', marginBottom: '0.5rem' }}>
            One panel per gradient, each on its own scale — a 100 spd and a 60 spd method
            run at different pressures, so a shared axis would compare nothing. The band is
            ±10 % of the running baseline; dashed rules are sustained baseline drops
            (a wash, a new column); rings are flagged runs.
          </div>
          {analytical.map((ms, i) => (
            <EvBaselineChart key={ms.method} method={ms.method} ms={ms}
                             hue={EV_HUES[i % EV_HUES.length]} flagsByRun={flagsByRun} />
          ))}

          {/* ── Chart B ── */}
          {clogs.length > 0 && (
            <div style={{ marginTop: '1rem' }}>
              <h4 style={{ fontSize: '0.9rem', color: 'var(--text)', margin: '0 0 0.4rem' }}>
                Anatomy of a clog — every run that reached the cut-out
              </h4>
              <div style={{ color: 'var(--muted)', fontSize: '0.75rem', marginBottom: '0.6rem' }}>
                Each run is drawn against the reference it was judged against: the median
                of the last few clean runs of the same method, on absolute minutes. A
                clogging run tracks that reference exactly, then departs and climbs to the
                cut-out. The shaded span is the warning — the time between the departure
                and the moment the run actually hit the limit.
              </div>
              {clogs.map(r => (
                <EvClogTrace key={r.run} run={r} ceiling={d.ceiling_bar} />
              ))}
            </div>
          )}

          {/* ── Validation ── */}
          <EvValidation v={d.validation} />

          {/* ── Triage list ── */}
          {recent.length > 0 && (
            <div style={{ marginTop: '1rem' }}>
              <h4 style={{ fontSize: '0.9rem', color: 'var(--text)', margin: '0 0 0.35rem' }}>
                Most recent flagged runs
              </h4>
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', fontSize: '0.78rem' }}>
                  <thead>
                    <tr>
                      <th>When</th><th>Method</th>
                      <th style={{ textAlign: 'right' }}>Plateau</th>
                      <th style={{ textAlign: 'right' }}>vs baseline</th>
                      <th>State</th><th>Why</th>
                    </tr>
                  </thead>
                  <tbody>
                    {recent.map((f, i) => (
                      <tr key={i}>
                        <td style={{ whiteSpace: 'nowrap' }}>{evFmtDate(f.start)}</td>
                        <td style={{ color: 'var(--muted)' }}>{f.method}</td>
                        <td style={{ textAlign: 'right' }}>{evNum(f.plateau_bar, 0)} bar</td>
                        <td style={{ textAlign: 'right' }}>
                          {f.pct_over_baseline != null
                            ? `${f.pct_over_baseline > 0 ? '+' : ''}${evNum(f.pct_over_baseline, 0)}%`
                            : '—'}
                        </td>
                        <td><EvBadge sev={f.severity} /></td>
                        <td style={{ color: 'var(--muted)' }}>{f.reasons.join(' · ')}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── Wear counters ── */}
          {wear.pump_seal_ml && (
            <div style={{ marginTop: '1rem' }}>
              <h4 style={{ fontSize: '0.9rem', color: 'var(--text)', margin: '0 0 0.35rem' }}>
                Instrument wear — from the Evosep's own lifetime counters
              </h4>
              <div style={{ display: 'flex', gap: '0.6rem', flexWrap: 'wrap' }}>
                <EvTile label="Total analyses" value={(wear.total_analyses || 0).toLocaleString()}
                        note={`${evNum(wear.analyses_per_day, 1)}/day over the last ${evNum(wear.window_days, 0)} days`} />
                {Object.entries(wear.pump_seal_ml).map(([p, v]) => (
                  <EvTile key={p} label={`${p} seal`} value={(v.ml || 0).toLocaleString()} unit="mL"
                          note={`+${evNum(v.ml_per_day, 1)} mL/day`} />
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function MaintenanceTab() {
      const [days, setDays] = useState(90);
      const [view, setView] = useState('timeline');
      const [instFilter, setInstFilter] = useState('');
      const [picked, setPicked] = useState(null);
      const [month, setMonth] = useState(() => {
        const n = new Date();
        return new Date(n.getFullYear(), n.getMonth(), 1);
      });

      const { data, loading, error, reload } = useFetch(`/api/maintenance/calendar?days=${days}`, [days]);
      const { data: fleet } = useFetch('/api/fleet/instruments', []);
      const { data: sync } = useFetch('/api/community/sync-status', []);

      const today = useMemo(() => {
        const n = new Date();
        return new Date(n.getFullYear(), n.getMonth(), n.getDate());
      }, []);

      const allEvents = (data && Array.isArray(data.events)) ? data.events : [];

      // The server tells us which types count as downtime; fall back to the
      // one type we know so a stale server still renders spans.
      const downSet = useMemo(
        () => new Set((data && data.downtime_types) || ['downtime']),
        [data]
      );
      const isDown = useCallback(
        ev => ev && (ev.is_downtime === true || downSet.has(ev.event_type)),
        [downSet]
      );

      // Lanes come from the fleet list first so an instrument with a clean
      // record still gets a row — an empty lane is information.
      const instruments = useMemo(() => {
        const names = new Set();
        const fl = (fleet && fleet.instruments) || [];
        fl.forEach(r => { if (r && r.instrument) names.add(r.instrument); });
        allEvents.forEach(ev => { if (ev.instrument) names.add(ev.instrument); });
        return [...names].sort();
      }, [fleet, data]);

      const events = useMemo(
        () => (instFilter ? allEvents.filter(ev => ev.instrument === instFilter) : allEvents),
        [data, instFilter]
      );

      const lanes = instFilter ? [instFilter] : instruments;

      // Window: `days` back from today, extended forward if someone has
      // scheduled downtime ahead (capped so one far-future entry can't
      // squash the axis).
      const windowStart = addDays(today, -(days - 1));
      const windowEnd = useMemo(() => {
        let end = today;
        const cap = addDays(today, 60);
        events.forEach(ev => {
          const d = dateFromDayKey(eventSpan(ev)[1]);
          if (d && d > end) end = d;
        });
        return end > cap ? cap : end;
      }, [events, today]);
      const nDays = Math.max(1, daysBetween(windowStart, windowEnd) + 1);

      const sorted = useMemo(
        () => [...events].sort((a, b) => String(b.event_date || '').localeCompare(String(a.event_date || ''))),
        [events]
      );

      const nDowntime = events.filter(isDown).length;
      const daysLost = events.filter(isDown).reduce((acc, ev) => {
        const [s, e] = eventSpan(ev);
        const sd = dateFromDayKey(s), ed = dateFromDayKey(e) || dateFromDayKey(s);
        return acc + (sd && ed ? daysBetween(sd, ed) + 1 : 0);
      }, 0);

      const pickedId = picked && picked.id;
      const onPick = useCallback(ev => setPicked(p => (p && p.id === ev.id ? null : ev)), []);

      const selStyle = {
        padding:'0.3rem 0.5rem', background:'var(--bg)', color:'var(--text)',
        border:'1px solid var(--border)', borderRadius:'0.35rem', fontSize:'0.8rem',
        cursor:'pointer',
      };

      return (
        <div>
          <div className="card">
            <h3>Maintenance &amp; downtime calendar</h3>
            <p style={{color:'var(--muted)', fontSize:'0.85rem', marginBottom:'0.8rem'}}>
              Mark when an instrument is out of service and log the work done on it.
              Downtime is recorded as a span, which is what the planned community
              reliability leaderboard (MTBF, availability, recovery time) is computed from.
            </p>
            <MarkDowntimeForm instruments={instruments} sync={sync} onSaved={reload} />
            <div style={{display:'flex', flexWrap:'wrap', gap:'0.5rem', alignItems:'center'}}>
              <select value={view} onChange={e => setView(e.target.value)} style={selStyle}>
                <option value="timeline">Timeline</option>
                <option value="month">Month grid</option>
              </select>
              {view === 'timeline' ? (
                <select value={days} onChange={e => setDays(Number(e.target.value))} style={selStyle}>
                  {MAINT_WINDOWS.map(([d, label]) => <option key={d} value={d}>Last {label}</option>)}
                </select>
              ) : (
                <span style={{display:'inline-flex', gap:'0.3rem', alignItems:'center'}}>
                  <button onClick={() => setMonth(m => new Date(m.getFullYear(), m.getMonth() - 1, 1))}
                          style={{padding:'0.25rem 0.55rem', fontSize:'0.8rem'}}>‹</button>
                  <span style={{fontSize:'0.85rem', minWidth:'8.5rem', textAlign:'center'}}>
                    {month.toLocaleDateString([], {month:'long', year:'numeric'})}
                  </span>
                  <button onClick={() => setMonth(m => new Date(m.getFullYear(), m.getMonth() + 1, 1))}
                          style={{padding:'0.25rem 0.55rem', fontSize:'0.8rem'}}>›</button>
                </span>
              )}
              <select value={instFilter} onChange={e => setInstFilter(e.target.value)} style={selStyle}>
                <option value="">All instruments</option>
                {instruments.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
              <span style={{fontSize:'0.78rem', color:'var(--muted)'}}>
                {nDowntime} downtime {nDowntime === 1 ? 'entry' : 'entries'}
                {daysLost > 0 && ` · ${daysLost} instrument-days lost`}
                {' · '}{events.length} events in window
              </span>
            </div>

            {error && (
              <div style={{color:'var(--fail)', fontSize:'0.85rem', marginTop:'0.6rem'}}>
                Could not load the calendar: {error}.
                {/* A 404 here is almost always a dashboard server older than
                    this page, not a broken install — say so instead of
                    leaving an operator staring at a bare HTTP code. */}
                {String(error).includes('404') &&
                  ' This server predates the /api/maintenance/calendar route — update STAN on the host serving the dashboard.'}
              </div>
            )}
            {loading && !data && (
              <div style={{color:'var(--muted)', fontSize:'0.85rem', marginTop:'0.6rem'}}>Loading…</div>
            )}
            {data && !lanes.length && (
              <div className="empty">No instruments known to this dashboard yet.</div>
            )}
            {data && !!lanes.length && (
              view === 'timeline'
                ? <MaintTimeline instruments={lanes} events={events} start={windowStart}
                                 nDays={nDays} today={today} isDown={isDown}
                                 onPick={onPick} pickedId={pickedId} />
                : <MaintMonthGrid month={month} events={events} today={today} isDown={isDown}
                                  onPick={onPick} pickedId={pickedId} />
            )}
            <MaintLegend types={['column_change', 'column_clog', 'capillary_change', 'source_clean', 'calibration', 'lc_service', 'pm', 'other']} />
          </div>

          <div className="card">
            <h3>Log{instFilter ? ` — ${instFilter}` : ''}</h3>
            <MaintEntryList events={sorted} isDown={isDown} onPick={onPick} pickedId={pickedId} />
          </div>

          {/* Evosep first: the column is the part that actually fails week to
              week (clogs, overpressure, tip misses), so it earns the top slot
              over the MS acquisition summary. Brett's call, 2026-09-02. */}
          <EvosepColumnPanel />
          <BrukerAcquisitionPanel />
        </div>
      );
    }

    function TrendCharts() {
      // Pull instruments from actual runs in the DB, not from instruments.yml config
      const { data: allRuns } = useFetch('/api/runs?limit=1000');
      const [selected, setSelected] = useState(null);
      const [trends, setTrends] = useState(null);
      const [events, setEvents] = useState([]);
      const [timeFilter, setTimeFilter] = useState('all');
      const [eventsVersion, setEventsVersion] = useState(0);
      // Community cohort percentiles — fetched once, filtered client-side
      // to the cohorts relevant to the selected instrument.
      const { data: community } = useFetch('/api/community/cohort');

      const names = useMemo(() => {
        if (!allRuns) return [];
        return [...new Set(allRuns.map(r => r.instrument).filter(Boolean))];
      }, [allRuns]);

      useEffect(() => { if (names.length && !selected) setSelected(names[0]); }, [names]);
      useEffect(() => {
        if (!selected) return;
        fetch(API + `/api/trends/${encodeURIComponent(selected)}?limit=500`).then(r => r.json()).then(setTrends);
        fetch(API + `/api/instruments/${encodeURIComponent(selected)}/events?limit=50`).then(r => r.json()).then(d => setEvents(d || []));
      }, [selected, eventsVersion]);

      const handleEventSaved = useCallback(() => {
        setEventsVersion(v => v + 1);
      }, []);

      // Filter trends by time range
      const filteredTrends = useMemo(() => {
        if (!trends) return null;
        if (timeFilter === 'all') return trends;
        const now = new Date();
        const cutoffs = {
          week: 7,
          month: 30,
          '3month': 90,
          '6month': 180,
          year: 365,
        };
        const days = cutoffs[timeFilter] || 0;
        if (!days) return trends;
        const cutoff = new Date(now.getTime() - days * 86400000);
        return trends.filter(r => new Date(r.run_date) >= cutoff);
      }, [trends, timeFilter]);

      // Merge events into trend data by finding the nearest run date for each event
      function findEventsBetween(runs, idx) {
        if (!events.length || !runs || !runs.length) return [];
        const runDate = new Date(runs[idx]?.run_date);
        const prevDate = idx > 0 ? new Date(runs[idx - 1]?.run_date) : new Date(0);
        return events.filter(e => {
          const ed = new Date(e.event_date);
          return ed > prevDate && ed <= runDate;
        });
      }

      return (
        <div>
          <div className="tabs" style={{marginBottom: '1rem'}}>
            {names.length === 0 ? (
              <div style={{color:'var(--muted)'}}>No runs in database yet. Run a baseline first.</div>
            ) : names.map(n => <div key={n} className={`tab ${n === selected ? 'active' : ''}`} onClick={() => setSelected(n)}>{n}</div>)}
          </div>
          {selected && (
            <div className="card" style={{marginBottom:'1rem'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'0.5rem'}}>
                <h3 style={{margin:0}}>Maintenance Log</h3>
                <LogEventButton instrument={selected} onSaved={handleEventSaved} />
              </div>
              <MaintenanceEventsTable events={events} />
            </div>
          )}
          <div style={{display:'flex', gap:'0.5rem', marginBottom:'1rem', flexWrap:'wrap', alignItems:'center'}}>
            <span style={{fontSize:'0.85rem', color:'var(--muted)'}}>Time range:</span>
            {[['week','Week'], ['month','Month'], ['3month','3 Months'], ['6month','6 Months'], ['year','Year'], ['all','All']].map(([k, label]) => (
              <button key={k}
                onClick={() => setTimeFilter(k)}
                style={{
                  padding:'0.3rem 0.7rem',
                  background: timeFilter === k ? 'var(--accent)' : 'var(--bg)',
                  color: timeFilter === k ? '#000' : 'var(--text)',
                  border:'1px solid var(--border)',
                  borderRadius:'0.3rem',
                  cursor:'pointer',
                  fontSize:'0.8rem',
                }}>{label}</button>
            ))}
            {filteredTrends && <span style={{fontSize:'0.85rem', color:'var(--muted)', marginLeft:'auto'}}>{filteredTrends.length} runs</span>}
          </div>
          {!filteredTrends || filteredTrends.length === 0
            ? <div className="empty">No trend data for {selected || 'this instrument'}.</div>
            : <TrendGraphs runs={filteredTrends} events={events} community={community} selected={selected} timeFilter={timeFilter} />
          }
        </div>
      );
    }

    // Color palette for per-SPD series. Stable order so the same
    // SPD always gets the same color across all trend cards.
    const SPD_PALETTE = ['#60a5fa', '#f97316', '#a78bfa', '#22c55e', '#eab308', '#f472b6', '#14b8a6'];
    function spdColor(spd, idx) {
      return SPD_PALETTE[idx % SPD_PALETTE.length];
    }

    // Map an instrument_model string to the community cohort family
    // name. Mirror of stan.community.submit._instrument_family so the
    // client-side community-median lookup matches what submit.py
    // writes into cohort_id.
    function instrumentFamily(model) {
      if (!model) return '';
      const m = String(model).toLowerCase();
      if (m.includes('timstof') || m.includes('tims tof')) return 'timsTOF';
      if (m.includes('astral')) return 'Astral';
      if (m.includes('exploris')) return 'Exploris';
      if (m.includes('lumos') || m.includes('fusion')) return 'Lumos';
      if (m.includes('eclipse')) return 'Eclipse';
      if (m.includes('orbitrap')) return 'Orbitrap';
      return model;
    }

    // Given sorted percentile array from the community cohort API,
    // return the median (p50) or null if the array is empty/missing.
    function cohortMedian(percentiles) {
      if (!Array.isArray(percentiles) || percentiles.length === 0) return null;
      return percentiles[Math.floor(percentiles.length / 2)];
    }

    // Look up the community median for a (family, spd, amount_ng, metric)
    // across all matching cohorts in the fetched /api/community/cohort
    // payload. We match on the broad cohort prefix (family_spd_amount)
    // and ignore the column suffix so reference lines aren't fragmented
    // across column variants.
    function communityMedian(community, family, spd, amount_ng, metric) {
      if (!community?.cohorts || !family || !spd) return null;
      // Broad cohort prefix: family_{spd}spd_{amount_bucket}
      // amount_bucket: see stan/metrics/scoring.py::amount_bucket
      const ab = amount_ng >= 1000 ? 'very-high'
        : amount_ng >= 500 ? 'high'
        : amount_ng >= 200 ? 'standard'
        : amount_ng >= 100 ? 'mid'
        : amount_ng >= 50 ? 'low'
        : 'ultra-low';
      const prefix = `${family}_${spd}spd_${ab}`;
      const matches = Object.keys(community.cohorts).filter(
        k => k === prefix || k.startsWith(prefix + '_')
      );
      if (!matches.length) return null;
      // Merge values across all matching cohorts, then median.
      const all = [];
      for (const cid of matches) {
        const arr = community.cohorts[cid]?.[metric];
        if (Array.isArray(arr)) all.push(...arr);
      }
      if (!all.length) return null;
      all.sort((a, b) => a - b);
      return all[Math.floor(all.length / 2)];
    }

    // SVG sparkline trend component with per-SPD series, this-instrument
    // median + community median reference lines, and hover tooltips.
    function Sparkline({ runs, metric, maintEvents, label,
                        community, instrumentModel, amount_ng=50,
                        height=160, showDrift=true, showZeroLine=false }) {
      if (!runs || runs.length < 2) {
        return <div style={{color:'var(--muted)', fontSize:'0.8rem'}}>Not enough data</div>;
      }

      // 1. Extract values; runs are already sorted by date (ascending)
      //    by TrendGraphs. Compute date-based x position so each dot
      //    sits at its actual calendar position instead of being
      //    evenly spaced — otherwise per-SPD lines would lie.
      const dates = runs.map(r => new Date(r.run_date).getTime());
      const tMin = Math.min(...dates);
      const tMax = Math.max(...dates);
      const tRange = (tMax - tMin) || 1;

      const vals = runs.map(r => {
        const v = r[metric];
        return (v == null || isNaN(v)) ? null : Number(v);
      });
      // For signed metrics where 0 is a meaningful value (directional drift),
      // keep zeros in the valid set. For other metrics, treat 0 as missing.
      const validVals = showZeroLine
        ? vals.filter(v => v != null)
        : vals.filter(v => v != null && v !== 0);
      if (validVals.length === 0) {
        return <div style={{color:'var(--muted)', fontSize:'0.8rem'}}>No {metric} values</div>;
      }
      let vMin = Math.min(...validVals);
      let vMax = Math.max(...validVals);
      if (showZeroLine) {
        // Expand range to always include 0 so the "no drift" line is visible.
        vMin = Math.min(vMin, 0);
        vMax = Math.max(vMax, 0);
      }
      const vRange = (vMax - vMin) || Math.abs(vMax) || 1;

      const width = 800;
      const padding = 14;
      const w = width - padding * 2;
      const h = height - padding * 2;

      // 2. Group runs by SPD bucket. null/0 → "unk" so they still plot.
      const groups = new Map();  // spd -> [{idx, x, y, run}]
      runs.forEach((r, i) => {
        if (vals[i] == null) return;
        const spd = r.spd || null;
        const key = spd || 'unk';
        const x = padding + ((dates[i] - tMin) / tRange) * w;
        const y = padding + h - ((vals[i] - vMin) / vRange) * h;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ idx: i, x, y, run: r, value: vals[i] });
      });
      const groupKeys = [...groups.keys()].sort((a, b) => {
        if (a === 'unk') return 1;
        if (b === 'unk') return -1;
        return Number(b) - Number(a);  // 100 first, 30 last
      });

      // 3. This-instrument median (across all SPDs).
      const sortedVals = [...validVals].sort((a, b) => a - b);
      const instMedian = sortedVals[Math.floor(sortedVals.length / 2)];
      const instMedianY = padding + h - ((instMedian - vMin) / vRange) * h;

      // 4. Community median — per SPD when the cohort API has it.
      const family = instrumentFamily(instrumentModel);
      const communityMediansBySpd = new Map();
      if (community) {
        for (const key of groupKeys) {
          if (key === 'unk') continue;
          const cm = communityMedian(community, family, key, amount_ng, metric);
          if (cm != null) {
            communityMediansBySpd.set(key, {
              value: cm,
              y: padding + h - ((cm - vMin) / vRange) * h,
            });
          }
        }
      }

      // 5. Maintenance event vertical lines (time-axis based).
      const eventMarks = [];
      if (maintEvents) {
        for (const ev of maintEvents) {
          const t = new Date(ev.event_date).getTime();
          if (t < tMin || t > tMax) continue;
          const x = padding + ((t - tMin) / tRange) * w;
          eventMarks.push({ x, event: ev });
        }
      }

      // 5b. Drift marks — vertical dashed lines for runs flagged as drifted/warn.
      //     Drawn behind the trend line so points remain readable.
      const driftMarks = [];
      if (showDrift) {
        runs.forEach((r, i) => {
          const dc = r.drift_class;
          if (dc !== 'drifted' && dc !== 'warn') return;
          const x = padding + ((dates[i] - tMin) / tRange) * w;
          driftMarks.push({ x, run: r, severity: dc });
        });
      }

      const eventColors = {
        column_change:'#60a5fa', source_clean:'#22c55e',
        calibration:'#eab308', pm:'#a78bfa',
        lc_service:'#f472b6', other:'#94a3b8',
      };

      const zeroY = showZeroLine ? padding + h - ((0 - vMin) / vRange) * h : null;

      return (
        <div>
          <svg viewBox={`0 0 ${width} ${height}`} style={{width:'100%', height:`${height}px`}}>
            {/* Zero baseline for signed metrics — solid so direction is obvious */}
            {showZeroLine && (
              <line x1={padding} y1={zeroY} x2={width-padding} y2={zeroY}
                    stroke="#94a3b8" strokeWidth="1.2" opacity="0.7">
                <title>No drift (0.0)</title>
              </line>
            )}
            {/* This-instrument median — muted gray dashes */}
            <line x1={padding} y1={instMedianY} x2={width-padding} y2={instMedianY}
                  stroke="var(--muted)" strokeDasharray="4,4" strokeWidth="1" opacity="0.55">
              <title>This instrument median: {instMedian.toLocaleString()}</title>
            </line>
            {/* Community median — one faint dashed line per SPD, colored to match */}
            {[...communityMediansBySpd.entries()].map(([spd, cm], i) => {
              const idx = groupKeys.indexOf(spd);
              const c = spdColor(spd, idx);
              return (
                <line key={`cm-${spd}`} x1={padding} y1={cm.y} x2={width-padding} y2={cm.y}
                      stroke={c} strokeDasharray="2,5" strokeWidth="1.2" opacity="0.45">
                  <title>Community median @ {spd} SPD: {cm.value.toLocaleString()}</title>
                </line>
              );
            })}
            {/* Drift marks — drawn behind events/trend so points stay on top */}
            {driftMarks.map((dm, i) => {
              const c = dm.severity === 'drifted' ? '#ef4444' : '#f59e0b';
              return (
                <line key={`drift-${i}`} x1={dm.x} y1={padding} x2={dm.x} y2={height-padding}
                      stroke={c} strokeDasharray="2,3" strokeWidth="1.2" opacity="0.45">
                  <title>{`DIA window drift (${dm.severity}): ${dm.run.run_name}`}</title>
                </line>
              );
            })}
            {/* Maintenance events */}
            {eventMarks.map((em, i) => {
              const c = eventColors[em.event.event_type] || '#94a3b8';
              return (
                <line key={`ev-${i}`} x1={em.x} y1={padding} x2={em.x} y2={height-padding}
                      stroke={c} strokeDasharray="3,3" strokeWidth="2" opacity="0.7">
                  <title>{em.event.event_type}: {em.event.notes || em.event.event_date}</title>
                </line>
              );
            })}
            {/* Per-SPD trend lines */}
            {groupKeys.map((spd, gi) => {
              const pts = groups.get(spd);
              if (pts.length < 2) return null;
              const c = spdColor(spd, gi);
              const d = pts.map((p, i) =>
                `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`
              ).join(' ');
              return <path key={`line-${spd}`} d={d} fill="none" stroke={c} strokeWidth="2" opacity="0.9" />;
            })}
            {/* Per-SPD dots with hover tooltips */}
            {groupKeys.map((spd, gi) => {
              const pts = groups.get(spd);
              const c = spdColor(spd, gi);
              const cm = communityMediansBySpd.get(spd);
              const fmt = (v) => {
                if (v == null) return '—';
                // Integer-ish metrics print as localized ints; anything
                // with a fractional part prints with 2 decimals.
                return (Math.abs(v - Math.round(v)) < 1e-6)
                  ? Math.round(v).toLocaleString()
                  : v.toFixed(2);
              };
              return pts.map(p => {
                const dt = new Date(p.run.run_date);
                const dateStr = dt.toLocaleString([], {
                  year:'numeric', month:'short', day:'numeric',
                  hour:'2-digit', minute:'2-digit',
                });
                const spdLabel = spd === 'unk' ? 'SPD unknown' : `${spd} SPD`;
                // Tooltip now shows both medians alongside the point's
                // own value so the operator can see context without
                // eyeballing the reference lines.
                const tip =
                  `${p.run.run_name}\n` +
                  `${metric}: ${fmt(p.value)}\n` +
                  `this instrument median: ${fmt(instMedian)}\n` +
                  `community median (${spdLabel}): ${fmt(cm ? cm.value : null)}\n` +
                  `${spdLabel}\n` +
                  `${dateStr}`;
                return (
                  <circle key={`dot-${spd}-${p.idx}`}
                          cx={p.x} cy={p.y} r="3.5" fill={c}
                          stroke="#fff" strokeWidth="0.5">
                    <title>{tip}</title>
                  </circle>
                );
              });
            })}
            <text x={padding} y={padding-3} fill="var(--muted)" fontSize="11">{label}</text>
            <text x={width-padding} y={padding-3} fill="var(--muted)" fontSize="11" textAnchor="end">
              min: {vMin.toLocaleString()} · max: {vMax.toLocaleString()}
            </text>
          </svg>
          {/* Legend: SPD colors + reference line markers */}
          <div style={{display:'flex', gap:'1rem', flexWrap:'wrap', fontSize:'0.72rem',
                       color:'var(--muted)', marginTop:'0.3rem', paddingLeft:'1rem'}}>
            {groupKeys.map((spd, gi) => (
              <span key={`leg-${spd}`} style={{display:'inline-flex', alignItems:'center', gap:'0.3rem'}}>
                <span style={{width:'1.1rem', height:'2px', background:spdColor(spd, gi),
                             display:'inline-block'}}></span>
                {spd === 'unk' ? 'SPD ?' : `${spd} SPD`} ({groups.get(spd).length})
              </span>
            ))}
            <span style={{display:'inline-flex', alignItems:'center', gap:'0.3rem'}}>
              <span style={{width:'1.1rem', borderTop:'1px dashed var(--muted)',
                            display:'inline-block'}}></span>
              this instrument median
            </span>
            {communityMediansBySpd.size > 0 && (
              <span style={{display:'inline-flex', alignItems:'center', gap:'0.3rem'}}>
                <span style={{width:'1.1rem', borderTop:'1.2px dashed #888',
                             display:'inline-block', opacity:0.5}}></span>
                community median (per SPD)
              </span>
            )}
          </div>
        </div>
      );
    }

    function TrendGraphs({ runs, events, community, selected, timeFilter }) {
      // Sort runs by date ascending for trend plotting
      const sorted = useMemo(
        () => [...runs].sort((a, b) => new Date(a.run_date) - new Date(b.run_date)),
        [runs],
      );
      // Use the instrument model from the first run. All runs in a
      // trends call are from the same instrument but `selected` is the
      // instrument *name* — model is what drives community lookups.
      const instrumentModel = sorted[0]?.instrument || selected;
      // Default amount for community lookup. 50 ng is the lab default;
      // when we add per-cohort UI we'll let the user pick.
      const amount_ng = sorted[0]?.amount_ng || 50;

      const common = {
        runs: sorted, maintEvents: events,
        community, instrumentModel, amount_ng,
      };

      return (
        <div className="grid" style={{gridTemplateColumns:'1fr'}}>
          <div className="card">
            <h3>Precursors / PSMs over time</h3>
            {/* Prefer precursors; DDA-only cohorts will show 0 here — n_psms
                card below covers them. */}
            <Sparkline {...common} metric="n_precursors" label="Precursors" />
          </div>
          <div className="card">
            <h3>Peptides over time</h3>
            <Sparkline {...common} metric="n_peptides" label="Peptides" />
          </div>
          <div className="card">

    // cIRT anchor retention-time chart.
    //
    // Shows observed RT over time for the endogenous-HeLa anchor
    // peptide panel seeded in stan/metrics/cirt.py (one line per
    // peptide). Must split by SPD because the same peptide elutes
    // at very different absolute RTs on different gradients — a
    // 30-SPD peptide at 25 min would dominate the y-axis and
    // flatten out a 100-SPD peptide at 7 min.
    //
    // Empty state: show instructions when no irt_anchor_rts rows
    // exist for the selected instrument (user hasn't run
    // `stan backfill-cirt` yet, or their instrument doesn't have
    // a seeded panel for any SPD).
    function CIRTCard({ instrument, timeFilter }) {
      const [data, setData] = useState(null);
      const [selectedSpd, setSelectedSpd] = useState(null);

      useEffect(() => {
        if (!instrument) return;
        setData(null);
        fetch(API + `/api/cirt/${encodeURIComponent(instrument)}?limit=500`)
          .then(r => r.json())
          .then(setData)
          .catch(() => setData({ peptides: {}, n_runs: 0 }));
      }, [instrument]);

      // Apply the Trends-page time filter (Week / Month / etc.) to
      // every peptide's observation list. Without this the chart
      // always shows the full 500-run history regardless of the
      // button the user picked at the top of the page.
      const filteredData = useMemo(() => {
        if (!data?.peptides) return data;
        const cutoffs = { week: 7, month: 30, '3month': 90, '6month': 180, year: 365 };
        const days = cutoffs[timeFilter];
        if (!days) return data;
        const cutoff = new Date(Date.now() - days * 86400000);
        const out = {};
        for (const [seq, p] of Object.entries(data.peptides)) {
          const obs = p.observations.filter(o => new Date(o.run_date) >= cutoff);
          if (obs.length) out[seq] = { ...p, observations: obs };
        }
        return { ...data, peptides: out };
      }, [data, timeFilter]);

      // Every SPD that appears in at least one observation across
      // all peptides. Defaulting to the SPD with the most data.
      const availableSpds = useMemo(() => {
        if (!filteredData?.peptides) return [];
        const counts = new Map();
        for (const p of Object.values(filteredData.peptides)) {
          for (const o of p.observations) {
            const k = o.spd || null;
            counts.set(k, (counts.get(k) || 0) + 1);
          }
        }
        return [...counts.entries()]
          .sort((a, b) => (b[1] - a[1]))
          .map(([k]) => k);
      }, [filteredData]);

      useEffect(() => {
        if (availableSpds.length && selectedSpd == null) {
          setSelectedSpd(availableSpds[0]);
        }
      }, [availableSpds, selectedSpd]);

      if (!data) {
        return (
          <div className="card">
            <h3>cIRT anchor RT drift</h3>
            <div style={{color:'var(--muted)', fontSize:'0.85rem'}}>Loading…</div>
          </div>
        );
      }
      if (!data.peptides || Object.keys(data.peptides).length === 0) {
        return (
          <div className="card">
            <h3>cIRT anchor RT drift</h3>
            <div style={{color:'var(--muted)', fontSize:'0.85rem'}}>
              No cIRT anchors extracted for {instrument}. Run{' '}
              <code>stan backfill-cirt</code> to populate this chart from
              existing report.parquet files. Requires a seeded panel
              for the instrument family — see{' '}
              <code>stan/metrics/cirt.py::EMPIRICAL_CIRT_PANELS</code>.
            </div>
          </div>
        );
      }
      if (!filteredData.peptides || Object.keys(filteredData.peptides).length === 0) {
        return (
          <div className="card">
            <h3>cIRT anchor RT drift</h3>
            <div style={{color:'var(--muted)', fontSize:'0.85rem'}}>
              No cIRT anchors in the selected time range. Widen the Time range filter above.
            </div>
          </div>
        );
      }

      return (
        <div className="card">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'0.5rem'}}>
            <h3 style={{margin:0}}>cIRT anchor RT drift</h3>
            <div style={{display:'flex', gap:'0.4rem', alignItems:'center', fontSize:'0.8rem'}}>
              <span style={{color:'var(--muted)'}}>SPD:</span>
              {availableSpds.map(spd => (
                <button key={`cirt-spd-${spd}`}
                  onClick={() => setSelectedSpd(spd)}
                  style={{
                    padding:'0.2rem 0.55rem',
                    background: selectedSpd === spd ? 'var(--accent)' : 'var(--bg)',
                    color: selectedSpd === spd ? '#000' : 'var(--text)',
                    border:'1px solid var(--border)',
                    borderRadius:'0.25rem', cursor:'pointer',
                    fontSize:'0.75rem',
                  }}>
                  {spd == null ? '?' : spd}
                </button>
              ))}
            </div>
          </div>
          <p style={{fontSize:'0.75rem', color:'var(--muted)', margin:'0.25rem 0 0.5rem 0'}}>
            Each line = one anchor peptide's observed RT across runs at this
            SPD. Flat lines = LC behaving normally; upward or downward drift =
            column/gradient change. Horizontal dashes = the panel's reference RT.
          </p>
          <CIRTSparkline peptides={filteredData.peptides} spd={selectedSpd} />
        </div>
      );
    }

    function CIRTSparkline({ peptides, spd, height=200 }) {
      // Filter each peptide's observations down to the chosen SPD.
      const series = useMemo(() => {
        const out = [];
        for (const [seq, p] of Object.entries(peptides)) {
          const obs = p.observations.filter(o =>
            (o.spd || null) === (spd || null)
          );
          if (obs.length < 1) continue;
          out.push({ peptide: seq, reference_rt_min: p.reference_rt_min, obs });
        }
        // Sort by reference RT so legend order matches RT order.
        out.sort((a, b) => (a.reference_rt_min || 0) - (b.reference_rt_min || 0));
        return out;
      }, [peptides, spd]);

      if (series.length === 0) {
        return (
          <div style={{color:'var(--muted)', fontSize:'0.8rem'}}>
            No anchor observations at this SPD.
          </div>
        );
      }

      // Shared x-axis = full date range across every peptide at this SPD.
      // Shared y-axis = full RT range observed across every peptide
      // (lets you see absolute RT differences at a glance — a flat line
      // at y=10 visually sits above one at y=5).
      const allDates = [];
      const allRts = [];
      for (const s of series) {
        for (const o of s.obs) {
          allDates.push(new Date(o.run_date).getTime());
          allRts.push(o.observed_rt_min);
        }
      }
      const tMin = Math.min(...allDates);
      const tMax = Math.max(...allDates);
      const tRange = (tMax - tMin) || 1;
      // Include reference RTs in the Y range so the dashed line is visible
      series.forEach(s => {
        if (s.reference_rt_min != null) allRts.push(s.reference_rt_min);
      });
      const rtMin = Math.min(...allRts);
      const rtMax = Math.max(...allRts);
      const rtRange = (rtMax - rtMin) || 1;

      const width = 800;
      const padding = 14;
      const w = width - padding * 2;
      const h = height - padding * 2;

      // Assign each peptide a stable color from the SPD palette
      const colorFor = (i) => SPD_PALETTE[i % SPD_PALETTE.length];

      return (
        <div>
          <svg viewBox={`0 0 ${width} ${height}`} style={{width:'100%', height:`${height}px`}}>
            {/* Reference-RT dashed line per peptide */}
            {series.map((s, si) => {
              if (s.reference_rt_min == null) return null;
              const y = padding + h - ((s.reference_rt_min - rtMin) / rtRange) * h;
              const c = colorFor(si);
              return (
                <line key={`ref-${s.peptide}`}
                      x1={padding} y1={y} x2={width-padding} y2={y}
                      stroke={c} strokeDasharray="2,6" strokeWidth="1" opacity="0.35">
                  <title>{s.peptide} reference: {s.reference_rt_min} min</title>
                </line>
              );
            })}
            {/* Observed-RT lines per peptide */}
            {series.map((s, si) => {
              const pts = s.obs
                .map(o => {
                  const t = new Date(o.run_date).getTime();
                  return {
                    x: padding + ((t - tMin) / tRange) * w,
                    y: padding + h - ((o.observed_rt_min - rtMin) / rtRange) * h,
                    obs: o,
                  };
                })
                .sort((a, b) => a.x - b.x);
              const c = colorFor(si);
              const d = pts.map((p, i) =>
                `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`
              ).join(' ');
              return (
                <g key={`line-${s.peptide}`}>
                  {pts.length > 1 && <path d={d} fill="none" stroke={c} strokeWidth="1.8" opacity="0.9" />}
                  {pts.map((p, pi) => {
                    const dt = new Date(p.obs.run_date);
                    const dateStr = dt.toLocaleString([], {
                      year:'numeric', month:'short', day:'numeric',
                      hour:'2-digit', minute:'2-digit',
                    });
                    const delta = s.reference_rt_min != null
                      ? (p.obs.observed_rt_min - s.reference_rt_min).toFixed(2)
                      : 'n/a';
                    const tip =
                      `${s.peptide}\n` +
                      `${p.obs.run_name}\n` +
                      `RT: ${p.obs.observed_rt_min.toFixed(2)} min (Δref ${delta})\n` +
                      `${dateStr}`;
                    return (
                      <circle key={`dot-${s.peptide}-${pi}`}
                              cx={p.x} cy={p.y} r="2.5" fill={c}
                              stroke="#fff" strokeWidth="0.4">
                        <title>{tip}</title>
                      </circle>
                    );
                  })}
                </g>
              );
            })}
            <text x={padding} y={padding-3} fill="var(--muted)" fontSize="11">RT (min)</text>
            <text x={width-padding} y={padding-3} fill="var(--muted)" fontSize="11" textAnchor="end">
              {rtMin.toFixed(1)} – {rtMax.toFixed(1)} min
            </text>
          </svg>
          <div style={{display:'flex', gap:'0.8rem', flexWrap:'wrap', fontSize:'0.7rem',
                       color:'var(--muted)', marginTop:'0.3rem', paddingLeft:'1rem'}}>
            {series.map((s, si) => (
              <span key={`cirt-leg-${s.peptide}`} style={{display:'inline-flex', alignItems:'center', gap:'0.3rem'}}>
                <span style={{width:'1rem', height:'2px', background:colorFor(si),
                              display:'inline-block'}}></span>
                {s.peptide}
                <span style={{color:'var(--muted)', opacity:0.7}}>
                  ({s.reference_rt_min != null ? `ref ${s.reference_rt_min.toFixed(1)}m` : 'no ref'}, n={s.obs.length})
                </span>
              </span>
            ))}
          </div>
        </div>
      );
    }

    /* Sync panel: publish this lab's QC runs to the community benchmark.
       The lab identity is a pseudonym ("Clogged PeakTail"), never a real
       name — see stan/community/pseudonym.py. One is minted on first sync
       if the install has none, so nobody publishes as "anonymous" forever
       just because they skipped a setup step. */
    function CommunitySync() {
      const { data: status, reload } = useFetch('/api/community/sync-status', []);
      const [name, setName] = useState('');
      const [busy, setBusy] = useState(false);
      const [result, setResult] = useState(null);

      useEffect(() => {
        if (status && !name) setName(status.suggested_name || '');
      }, [status]);

      if (!status) return null;
      if (status.readonly) {
        /* Public visitor on the hosted dashboard. Publishing acts on the
           lab's behalf, so it needs a signed-in operator — offer the login
           rather than a dead end. Anyone can still read the whole site. */
        return (
          <div className="card" style={{marginBottom:'1rem'}}>
            <h3>Community sync</h3>
            <p style={{color:'var(--muted)', fontSize:'0.85rem', marginBottom:'0.8rem'}}>
              Publishing this lab's runs needs an authorized operator. Everything
              else on this dashboard is public — signing in only unlocks the sync.
            </p>
            {status.can_sign_in && (
              <a href={status.login_url || '/.auth/login/aad?post_login_redirect_uri=/'}
                 style={{display:'inline-block', padding:'0.75rem 1.4rem',
                         fontSize:'1rem', fontWeight:600, borderRadius:'0.5rem',
                         background:'linear-gradient(180deg,#5ee9a4,#34c98a)',
                         color:'#04180f', textDecoration:'none'}}>
                Sign in with UC Davis
              </a>
            )}
            {status.signed_in_as && (
              <p style={{color:'var(--muted)', fontSize:'0.78rem', marginTop:'0.7rem'}}>
                Signed in as {status.signed_in_as}, but not on this dashboard's
                operator list. Ask Brett to add you.
              </p>
            )}
          </div>
        );
      }

      const pending = status.pending;
      const doSync = () => {
        setBusy(true); setResult(null);
        fetch(API + '/api/community/sync', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ display_name: name }),
        })
          .then(r => r.json())
          .then(d => { setResult(d); setBusy(false); reload(); })
          .catch(e => { setResult({ok:false, error:String(e)}); setBusy(false); });
      };

      return (
        <div className="card" style={{marginBottom:'1rem'}}>
          <h3>Community sync</h3>
          <p style={{color:'var(--muted)', fontSize:'0.85rem', marginBottom:'0.6rem'}}>
            Publishes aggregate QC metrics only — never raw files, never sample
            or patient metadata. You appear under a pseudonym.
          </p>
          <div style={{display:'flex', gap:'0.5rem', alignItems:'center',
                       flexWrap:'wrap', marginBottom:'0.9rem'}}>
            <label style={{fontSize:'0.85rem', color:'var(--muted)'}}>Lab name</label>
            <input value={name} onChange={e => setName(e.target.value)}
                   maxLength={60}
                   style={{background:'var(--bg)', color:'var(--text)',
                           border:'1px solid var(--border)', borderRadius:'0.35rem',
                           padding:'0.35rem 0.6rem', minWidth:'210px'}} />
          </div>
          {/* The primary action of this tab, so it is sized like one: full
              width and unmissable rather than a button among buttons. It is
              disabled when there is nothing to send, so the label always
              states what pressing it would actually do. */}
          <button onClick={doSync} disabled={busy || pending === 0}
                  style={{width:'100%', padding:'0.95rem 1rem',
                          fontSize:'1.05rem', fontWeight:600,
                          borderRadius:'0.5rem', cursor: (busy || pending === 0) ? 'default' : 'pointer',
                          border:'none', letterSpacing:'0.01em',
                          color: pending > 0 && !busy ? '#04180f' : 'var(--muted)',
                          background: busy ? 'var(--border)'
                                    : pending > 0 ? 'linear-gradient(180deg,#5ee9a4,#34c98a)'
                                    : 'var(--border)'}}>
            {busy ? 'Syncing to public STAN…'
                  : pending > 0
                    ? `Sync ${pending} run${pending === 1 ? '' : 's'} to public STAN`
                    : 'Nothing new to sync'}
          </button>
          {result && (
            <div style={{marginTop:'0.7rem', fontSize:'0.85rem',
                         color: result.ok ? '#4ade80' : '#f87171'}}>
              {result.ok
                ? `Submitted ${result.submitted}${result.failed ? `, ${result.failed} failed` : ''} as ${result.display_name}.`
                : `Sync failed: ${String(result.error || '').slice(0, 160)}`}
              {result.ok && result.errors && result.errors.length > 0 && (
                <ul style={{marginTop:'0.4rem', color:'var(--muted)', fontSize:'0.78rem'}}>
                  {result.errors.map((e, i) => <li key={i}>{e}</li>)}
                </ul>
              )}
            </div>
          )}
          <p style={{color:'var(--muted)', fontSize:'0.75rem', marginTop:'0.6rem'}}>
            Runs appear on the public site after the nightly consolidation.
          </p>
        </div>
      );
    }
