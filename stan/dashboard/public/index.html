    /* ── Instrument overview (moved off the front page) ────────────
       Instrument cards + Week-at-a-glance. These describe the fleet, so
       they live at the top of the Fleet tab rather than competing with
       "This Week's QCs" for the landing page. Self-fetching so it can be
       dropped in without threading LiveRuns' state through. */
    function InstrumentOverview() {
      const { data: allRuns, loading, reload } = useFetch('/api/runs?limit=200&qc_only=True');
      useEffect(() => { const t = setInterval(reload, 30000); return () => clearInterval(t); }, [reload]);

      if (loading && !allRuns) return <div className="card">Loading instruments…</div>;
      if (!Array.isArray(allRuns) || allRuns.length === 0) return null;

      // Most recent run per instrument.
      const byInstrument = {};
      for (const r of allRuns) {
        if (!byInstrument[r.instrument]) byInstrument[r.instrument] = r;
      }

      return (
        <>
          {(() => {
          const instruments = Object.entries(byInstrument);
          const nInst = instruments.length;
          const useTwoZone = nInst > 0 && nInst <= 3;
          const instrumentCards = instruments.map(([name, run]) => (
            // Stretch to the grid row height and lay out as a column so the
            // sparkline + "Log event" footer sit flush at the bottom. Cards
            // ended ragged otherwise: instruments differ in how many metric
            // rows they have (DIA shows Precursors, DDA shows PSMs, and a
            // missing PEG/Drift or diagnosis line drops another row).
            <div className="card" key={name}
                 style={{display:'flex', flexDirection:'column', height:'100%'}}>
              <h3 style={{display:'flex', alignItems:'center', gap:'0.5rem', flexWrap:'wrap'}}>
                {name}
                <LastQcBadge instrument={name} />
              </h3>
              <ColumnLifeBadge instrument={name} />
              <div className="metric"><span className="metric-label">Last run</span><span className="metric-value" title={run.run_name} style={{maxWidth:'60%', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{run.run_name}</span></div>
              <div className="metric"><span className="metric-label">Mode</span><span className="metric-value">{run.mode}</span></div>
              <div className="metric"><span className="metric-label">IPS</span><span className="badge badge-ips">IPS {run.ips_score || '—'}</span></div>
              <div className="metric">
                <span className="metric-label">PEG / Drift</span>
                <span style={{display:'inline-flex', gap:'0.3rem'}}>
                  <PegBadge run={run} /><DriftBadge run={run} />
                </span>
              </div>
              {run.mode === 'DIA' && <div className="metric"><span className="metric-label">Precursors</span><span className="metric-value">{run.n_precursors?.toLocaleString()}</span></div>}
              {run.mode === 'DDA' && <div className="metric"><span className="metric-label">PSMs</span><span className="metric-value">{run.n_psms?.toLocaleString()}</span></div>}
              <div className="metric"><span className="metric-label">Time</span><span className="metric-value" title={new Date(run.run_date).toLocaleString()}>{new Date(run.run_date).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span></div>
              <div style={{marginTop:'auto'}}>
                <MiniSparkline allRuns={allRuns} instrument={name} currentMode={run.mode} />
                {run.diagnosis && <div className="diagnosis">{run.diagnosis}</div>}
                <LogEventButton instrument={name} />
              </div>
            </div>
          ));

          if (!useTwoZone) {
            return <div className="grid">{instrumentCards}</div>;
          }
          // Two-zone grid: instrument cards get enough columns for their
          // count, heatmap fills the rest. The `--inst-cols` var and
          // `1fr` trailing track mean 1 card takes 33%, 2 cards take
          // 50%, 3 cards take 66% — heatmap always gets the remainder.
          const gridTemplate =
            nInst === 1 ? 'minmax(300px, 380px) 1fr'
            : nInst === 2 ? 'minmax(300px, 360px) minmax(300px, 360px) 1fr'
            : 'minmax(280px, 340px) minmax(280px, 340px) minmax(280px, 340px) 1fr';
          return (
            <div style={{display:'grid', gridTemplateColumns: gridTemplate,
                         gap:'1rem', alignItems:'stretch'}}>
              {instrumentCards}
              <WeekHeatmap instruments={instruments.map(([n]) => n)} />
            </div>
          );
          
          })()}
        </>
      );
    }

    /* ── Cross-instrument sensitivity ──────────────────────────────
       Same standard (50 ng HeLa), grouped by SPD. SPD stays a separate
       row rather than being pooled per instrument because throughput
       dominates depth — pooling a 30 SPD run with a 100 SPD one would
       compare gradient length, not sensitivity. */
    function InstrumentComparison() {
      const [days, setDays] = useState(90);
      const [metric, setMetric] = useState('precursors');
      const { data, loading, error } = useFetch(`/api/fleet/comparison?days=${days}`, [days]);

      const METRICS = [['precursors', 'Precursors'], ['peptides', 'Peptides'], ['proteins', 'Protein groups']];

      if (loading && !data) return <div className="card">Loading comparison…</div>;
      if (error) return <div className="card" style={{ color: '#c33' }}>Error: {error}</div>;
      if (!data) return null;
      const cohorts = (data.cohorts || []).filter(c => (c[metric] || 0) > 0);
      if (!cohorts.length) {
        return (
          <div className="card">
            <h3>Cross-instrument sensitivity</h3>
            <div style={{ color: 'var(--muted)', fontSize: '0.85rem' }}>
              No cohorts with ≥3 runs at {data.amount_ng} ng in the last {days} days.
            </div>
          </div>
        );
      }
      // Colour follows the instrument, never its rank, so filtering the
      // window can't repaint the survivors.
      const instruments = Array.from(new Set(data.cohorts.map(c => c.instrument))).sort();
      const colorOf = i => SERIES[instruments.indexOf(i) % SERIES.length];
      const max = Math.max(...cohorts.map(c => c[metric] || 0));
      const fmt = v => v == null ? '—' : Number(v).toLocaleString();

      return (
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: '0.5rem' }}>
            <h3 style={{ marginBottom: 0 }}>Cross-instrument sensitivity</h3>
            <div style={{ display: 'flex', gap: '0.4rem', fontSize: '0.8rem' }}>
              <select value={metric} onChange={e => setMetric(e.target.value)}>
                {METRICS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
              <select value={days} onChange={e => setDays(Number(e.target.value))}>
                <option value={30}>30 days</option>
                <option value={90}>90 days</option>
                <option value={365}>1 year</option>
              </select>
            </div>
          </div>
          <div style={{ fontSize: '0.78rem', color: 'var(--muted)', margin: '0.35rem 0 0.7rem' }}>
            Median {METRICS.find(m => m[0] === metric)[1].toLowerCase()} at {data.amount_ng} ng HeLa, by SPD cohort (≥{data.min_runs} runs).
            {instruments.map(i => (
              <span key={i} style={{ marginLeft: '0.7rem' }}>
                <span style={{ color: colorOf(i) }}>■</span> {i}
              </span>
            ))}
          </div>

          {cohorts.map((c, idx) => {
            const v = c[metric] || 0;
            const pct = max > 0 ? (v / max) * 100 : 0;
            return (
              <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '0.32rem' }}>
                <div style={{ width: '190px', fontSize: '0.78rem', color: 'var(--text)', flexShrink: 0 }}>
                  {c.instrument} <span style={{ color: 'var(--muted)' }}>· {c.spd ?? '?'} SPD</span>
                </div>
                <div style={{ flex: 1, background: 'var(--bg)', borderRadius: '3px', height: '18px', position: 'relative', minWidth: '80px' }}>
                  <div style={{ width: `${pct}%`, background: colorOf(c.instrument), height: '100%', borderRadius: '3px' }} />
                </div>
                <div style={{ width: '76px', textAlign: 'right', fontSize: '0.78rem', fontVariantNumeric: 'tabular-nums' }}>{fmt(v)}</div>
                <div style={{ width: '52px', textAlign: 'right', fontSize: '0.72rem', color: 'var(--muted)' }}>n={c.n_runs}</div>
              </div>
            );
          })}

          <details style={{ marginTop: '0.8rem' }}>
            <summary style={{ cursor: 'pointer', color: 'var(--muted)', fontSize: '0.78rem' }}>Table view</summary>
            <table style={{ marginTop: '0.5rem' }}>
              <thead><tr>
                <th>Instrument</th><th>SPD</th><th>Mode</th><th style={{ textAlign: 'right' }}>Runs</th>
                <th style={{ textAlign: 'right' }}>Precursors</th><th style={{ textAlign: 'right' }}>Peptides</th>
                <th style={{ textAlign: 'right' }}>Proteins</th><th style={{ textAlign: 'right' }}>IPS</th>
              </tr></thead>
              <tbody>
                {data.cohorts.map((c, i) => (
                  <tr key={i}>
                    <td>{c.instrument}</td><td>{c.spd ?? '—'}</td><td>{c.mode || '—'}</td>
                    <td style={{ textAlign: 'right' }}>{c.n_runs}</td>
                    <td style={{ textAlign: 'right' }}>{fmt(c.precursors)}</td>
                    <td style={{ textAlign: 'right' }}>{fmt(c.peptides)}</td>
                    <td style={{ textAlign: 'right' }}>{fmt(c.proteins)}</td>
                    <td style={{ textAlign: 'right' }}>{c.ips ?? '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </details>
        </div>
      );
    }

    /* Ingest freshness from the runs table. This replaced the old
       instrument-PC heartbeat: all searching happens on Hive now, so the
       PCs no longer run a watcher and their status.json heartbeats sat
       permanently stale in red for machines behaving exactly as intended.
       What matters is whether QC runs are still landing. */
    function IngestFreshness() {
      const { data } = useFetch('/api/fleet/instruments', []);
      if (!data || !(data.instruments || []).length) return null;
      const ageDays = iso => {
        if (!iso) return null;
        const t = new Date(String(iso).replace(' ', 'T'));
        return isNaN(t) ? null : (Date.now() - t.getTime()) / 86400000;
      };
      return (
        <div className="card">
          <h3>QC ingest</h3>
          <table>
            <thead><tr>
              <th>Instrument</th><th>Last QC ingested</th>
              <th style={{ textAlign: 'right' }}>Last 7 days</th>
              <th style={{ textAlign: 'right' }}>Total runs</th>
            </tr></thead>
            <tbody>
              {data.instruments.map(r => {
                const age = ageDays(r.last_run_date);
                const tone = age == null ? 'var(--muted)' : age <= 3 ? '#199e70' : age <= 10 ? 'var(--accent)' : '#d95926';
                return (
                  <tr key={r.instrument}>
                    <td>{r.instrument}</td>
                    <td style={{ color: tone }}>
                      {r.last_run_date ? String(r.last_run_date).slice(0, 16) : '—'}
                      {age != null && <span style={{ color: 'var(--muted)' }}> · {age < 1 ? 'today' : `${age.toFixed(0)}d ago`}</span>}
                    </td>
                    <td style={{ textAlign: 'right' }}>{r.n_last_7d}</td>
                    <td style={{ textAlign: 'right' }}>{r.n_runs.toLocaleString()}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{ fontSize: '0.7rem', color: 'var(--muted)', marginTop: '0.5rem' }}>
            Searching runs on Hive, so this tracks ingest into the central DB — not instrument-PC heartbeats.
          </div>
        </div>
      );
    }

    /* ── Fleet tab ─────────────────────────────────────────────────
       Reads <mirror>/<host>/status.json for every instrument mounted
       on the shared drive. Lets the user fire a whitelisted command
       (ping / status / tail_log / export_db_snapshot) and poll the
       result file. Read-only view by default; command buttons are
       hidden behind a toggle so they can't be clicked by accident. */
    function FleetHostRow({ host, expanded, onToggle, onCommand, result }) {
      const s = host.status || {};
      const last = s.last_run || {};

      // v0.2.235: surface watcher crashes from status.json so a
      // dead/crashing watcher is visible at a glance instead of
      // requiring a manual log dive on the instrument PC.
      const crashes = Number(s.watcher_crashes_24h || 0);
      const crashBadge = crashes > 0 ? (
        <span title={s.last_watcher_crash || ''}
              style={{
                display: 'inline-block',
                marginLeft: '0.5rem',
                padding: '1px 7px',
                fontSize: '11px',
                background: '#fef2f2',
                color: '#b91c1c',
                border: '1px solid #fca5a5',
                borderRadius: '6px',
              }}>
          ⚠ {crashes} watcher crash{crashes === 1 ? '' : 'es'} (24h)
        </span>
      ) : null;

      return (
        <>
          <tr style={{ cursor: 'pointer' }} onClick={() => onToggle(host.name)}>
            <td>{expanded ? '▾' : '▸'} {host.name}{crashBadge}</td>
            <td>{s.stan_version || '—'}</td>
            <td style={{ textAlign: 'right' }}>{s.n_runs ?? '—'}</td>
            <td>{last.run_name || '—'}</td>
            <td>{s.disk_free_gb ? `${s.disk_free_gb} GB` : '—'}</td>
          </tr>
          {expanded && (
            <tr>
              <td colSpan={5} style={{ background: '#fafafa', padding: '0.75rem 1rem' }}>
                <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.5rem', flexWrap: 'wrap' }}>
                  <button onClick={() => onCommand(host.name, 'status')}>Refresh status</button>
                  <button onClick={() => onCommand(host.name, 'tail_log', { name: 'baseline', n: 50 })}>Tail baseline.log (50)</button>
                  <button onClick={() => onCommand(host.name, 'watcher_debug')}>Watcher debug</button>
                  <button onClick={() => onCommand(host.name, 'export_db_snapshot')}>Export DB snapshot</button>
                </div>
                {host.error && <div style={{ color: '#c33' }}>{host.error}</div>}
                {result && (
                  <pre style={{ background: '#eee', padding: '0.5rem', borderRadius: 4, maxHeight: '24rem', overflow: 'auto', fontSize: '0.75rem' }}>
                    {JSON.stringify(result, null, 2)}
                  </pre>
                )}
              </td>
            </tr>
          )}
        </>
      );
    }

    function FleetPanel() {
      const { data, loading, error, reload } = useFetch('/api/fleet/hosts');
      const [expanded, setExpanded] = useState(null);
      const [pending, setPending] = useState({});   // {host: cmd_id}
      const [results, setResults] = useState({});   // {host: payload}

      // Auto-refresh host list every 30s
      useEffect(() => {
        const t = setInterval(reload, 30000);
        return () => clearInterval(t);
      }, [reload]);

      // Poll for a pending command's result
      useEffect(() => {
        const active = Object.entries(pending).filter(([, id]) => id);
        if (active.length === 0) return;
        const t = setInterval(() => {
          active.forEach(([host, cmdId]) => {
            fetch(API + `/api/fleet/result/${host}/${cmdId}`)
              .then(r => r.json())
              .then(d => {
                if (!d.pending) {
                  setResults(prev => ({ ...prev, [host]: d }));
                  setPending(prev => { const n = { ...prev }; delete n[host]; return n; });
                }
              })
              .catch(() => { /* transient, keep polling */ });
          });
        }, 2000);
        return () => clearInterval(t);
      }, [pending]);

      const sendCommand = (host, action, args) => {
        setResults(prev => ({ ...prev, [host]: { pending: true, action } }));
        fetch(API + '/api/fleet/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host, action, args: args || {} }),
        })
          .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)))
          .then(d => {
            setPending(prev => ({ ...prev, [host]: d.id }));
          })
          .catch(e => {
            setResults(prev => ({ ...prev, [host]: { status: 'error', message: e.detail || String(e) } }));
          });
      };

      if (loading && !data) return <div className="card">Loading fleet…</div>;
      if (error) return <div className="card" style={{ color: '#c33' }}>Fleet API error: {error}</div>;
      // Only the mirror-hosts TABLE needs the Quobyte mount. Instrument
      // overview, QC ingest and cross-instrument sensitivity all read the
      // database, so they must still render on a host with no mirror —
      // which is every hosted deployment. Bailing out here blanked the
      // entire Fleet tab on Azure even though the data was right there.
      if (!data || !data.root) {
        return (
          <>
          <InstrumentOverview />
          <IngestFreshness />
          <InstrumentComparison />
          <div className="card">
            <p><strong>No Hive mirror mounted on this machine.</strong></p>
            <p style={{ color: '#666', fontSize: '0.9rem' }}>
              The Fleet view reads <code>status.json</code> from each instrument's subdirectory
              on the shared mirror (default: <code>Y:\STAN\</code> on Windows,
              <code>/Volumes/proteomics-grp/STAN/</code> on macOS). Mount the share and reload.
              The panels above read the database and are unaffected.
            </p>
          </div>
          </>
        );
      }

      return (
        <>
        <InstrumentOverview />
        <IngestFreshness />
        <InstrumentComparison />
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <h2>Mirror hosts</h2>
            <div style={{ fontSize: '0.8rem', color: '#888' }}>
              <code>{data.root}</code> · {data.hosts.length} host(s) · auto-refresh 30s · <button onClick={reload}>↻</button>
            </div>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ textAlign: 'left', borderBottom: '1px solid #ddd' }}>
                <th>Host</th>
                <th>Version</th>
                <th style={{ textAlign: 'right' }}>Runs</th>
                <th>Last run</th>
                <th>Disk free</th>
              </tr>
            </thead>
            <tbody>
              {data.hosts.map(h => (
                <FleetHostRow
                  key={h.name}
                  host={h}
                  expanded={expanded === h.name}
                  onToggle={n => setExpanded(expanded === n ? null : n)}
                  onCommand={sendCommand}
                  result={results[h.name]}
                />
              ))}
            </tbody>
          </table>
          <p style={{ fontSize: '0.75rem', color: '#888', marginTop: '1rem' }}>
            Last state each host synced to the mirror. Searching runs on Hive, so these
            instrument-PC values are historical — see QC ingest above for live status.
            Click a row to expand the read-only command panel.
          </p>
        </div>
        </>
      );
    }

    /* ── Charting primitives ───────────────────────────────────────
       Inline SVG, no chart library: the page already pulls React +
       Babel from a CDN and a third dependency is not worth it for bar
       charts. Series colours come from the validated dark-surface
       categorical palette (slots 1/2/3) — see the dataviz palette
       reference. Never cycle hues; a 4th series would need a new slot. */
    const SERIES = ['#3987e5', '#d95926', '#199e70'];

    /* Bars with a hover tooltip. `data` is [{label, value}]. A chart in
       HTML is interactive by default, so every bar carries a hit target
       and a tooltip rather than relying on an axis read-off. */
    function BarChart({ data, color = SERIES[0], height = 120, valueFmt = v => v,
                        refLines = [] }) {
      const [hover, setHover] = useState(null);
      if (!data || !data.length) {
        return <div style={{ color: 'var(--muted)', padding: '1rem 0', fontSize: '0.85rem' }}>No data in range.</div>;
      }
      const max = Math.max(...data.map(d => d.value), ...refLines.map(r => r.value), 1);
      const n = data.length;
      const gap = n > 60 ? 0 : 2;              // 2px surface gap between bars
      const barW = Math.max(1, (100 / n));
      return (
        <div style={{ position: 'relative' }}>
          <svg viewBox={`0 0 100 ${height}`} preserveAspectRatio="none"
               style={{ width: '100%', height: `${height}px`, display: 'block', overflow: 'visible' }}>
            {refLines.map((r, i) => {
              const y = height - (r.value / max) * height;
              return (
                <g key={`ref${i}`}>
                  <line x1="0" x2="100" y1={y} y2={y} stroke={r.color || '#a0b4cc'}
                        strokeWidth="1" strokeDasharray="3 3" vectorEffect="non-scaling-stroke" opacity="0.75" />
                </g>
              );
            })}
            {data.map((d, i) => {
              const h = max > 0 ? (d.value / max) * height : 0;
              const x = i * barW;
              const isHot = hover && hover.i === i;
              return (
                <rect key={i} x={x + gap / 2} y={height - h}
                      width={Math.max(0.5, barW - gap)} height={h}
                      rx="1" fill={color} opacity={hover && !isHot ? 0.55 : 1}
                      onMouseEnter={() => setHover({ i, ...d })}
                      onMouseLeave={() => setHover(null)} />
              );
            })}
          </svg>
          {refLines.map((r, i) => (
            <div key={`rl${i}`} style={{
              position: 'absolute', right: 0,
              top: `${height - (r.value / max) * height - 14}px`,
              fontSize: '0.65rem', color: 'var(--muted)', pointerEvents: 'none',
            }}>{r.label}</div>
          ))}
          {hover && (
            <div style={{
              position: 'absolute', top: '-2px', left: `${Math.min(75, (hover.i / n) * 100)}%`,
              background: 'var(--bg)', border: '1px solid var(--border)',
              borderRadius: '4px', padding: '2px 7px', fontSize: '0.72rem',
              color: 'var(--text)', pointerEvents: 'none', whiteSpace: 'nowrap', zIndex: 5,
            }}>{hover.label}: <strong>{valueFmt(hover.value)}</strong></div>
          )}
        </div>
      );
    }

    /* A single number is a stat tile, not a chart. */
    function StatTile({ label, value, sub, tone }) {
      const color = tone === 'accent' ? 'var(--accent)' : 'var(--text)';
      return (
        <div style={{
          background: 'var(--bg)', border: '1px solid var(--border)',
          borderRadius: '0.5rem', padding: '0.6rem 0.9rem', minWidth: '120px', flex: '1 1 120px',
        }}>
          <div style={{ color: 'var(--muted)', fontSize: '0.72rem', textTransform: 'uppercase', letterSpacing: '0.03em' }}>{label}</div>
          <div style={{ fontSize: '1.5rem', fontWeight: 700, color, lineHeight: 1.25 }}>{value}</div>
          {sub && <div style={{ color: 'var(--muted)', fontSize: '0.72rem' }}>{sub}</div>}
        </div>
      );
    }

    /* Hour-of-week heatmap: 7 rows (days) x 24 columns (hours).
       Sequential encoding — ONE hue, light to dark, never a rainbow —
       because the value is a magnitude. Empty hours get a flat surface
       tone so "nothing ran" reads as absence, not as a low value. */
    function HourHeatmap({ grid }) {
      const [hover, setHover] = useState(null);
      if (!grid || !grid.length) {
        return (
          <div style={{ color: 'var(--muted)', fontSize: '0.85rem', padding: '0.6rem 0' }}>
            No hourly data yet — the Hive counter fills this in on its next run.
          </div>
        );
      }
      const max = Math.max(1, ...grid.flatMap(r => r.hours));
      // 5 steps of one hue, light→dark. Step by rank so a single busy hour
      // doesn't wash the rest of the week out to near-white.
      const STEPS = ['#0d2f57', '#14507f', '#1c72a8', '#2f9ad0', '#63c3ec'];
      const cellFor = v => {
        if (!v) return 'var(--bg)';
        const i = Math.min(STEPS.length - 1, Math.floor((v / max) * STEPS.length));
        return STEPS[i];
      };
      const HOURS = Array.from({ length: 24 }, (_, i) => i);
      return (
        <div>
          <div style={{ display: 'flex', gap: '2px', marginLeft: '38px', marginBottom: '2px' }}>
            {HOURS.map(h => (
              <div key={h} style={{
                flex: 1, textAlign: 'center', fontSize: '0.58rem', color: 'var(--muted)',
              }}>{h % 3 === 0 ? h : ''}</div>
            ))}
          </div>
          {grid.map(row => (
            <div key={row.date} style={{ display: 'flex', gap: '2px', marginBottom: '2px', alignItems: 'center' }}>
              <div style={{ width: '36px', fontSize: '0.65rem', color: 'var(--muted)', textAlign: 'right', paddingRight: '2px' }}>
                {row.dow}
              </div>
              {row.hours.map((v, h) => (
                <div key={h}
                     onMouseEnter={() => setHover({ ...row, h, v })}
                     onMouseLeave={() => setHover(null)}
                     style={{
                       flex: 1, height: '17px', borderRadius: '2px',
                       background: cellFor(v),
                       border: v ? 'none' : '1px solid var(--border)',
                       cursor: 'default',
                     }} />
              ))}
            </div>
          ))}
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginTop: '0.5rem', fontSize: '0.68rem', color: 'var(--muted)' }}>
            <span>none</span>
            <div style={{ width: '14px', height: '11px', borderRadius: '2px', background: 'var(--bg)', border: '1px solid var(--border)' }} />
            {STEPS.map(c => <div key={c} style={{ width: '14px', height: '11px', borderRadius: '2px', background: c }} />)}
            <span>{max} run{max === 1 ? '' : 's'}/hour</span>
            <span style={{ marginLeft: '0.8rem', minHeight: '1em' }}>
              {hover
                ? `${hover.dow} ${hover.date} · ${String(hover.h).padStart(2, '0')}:00 — ${hover.v || 'no'} run${hover.v === 1 ? '' : 's'}`
                : 'hover an hour for detail'}
            </span>
          </div>
        </div>
      );
    }

    /* ── Samples: throughput + utilisation ─────────────────────────
       Counts come from the Hive-side acquisition counter, not the runs
       table: STAN only ingests QC/HeLa runs, so `runs` sees a handful of
       injections a day out of a hundred real ones and would understate
       utilisation by an order of magnitude. */
    function UtilizationPanel() {
      const [days, setDays] = useState(60);
      const [inst, setInst] = useState('');

          <div className="card">

            </div>

      const names = Object.keys(data.instruments || {});
      if (!names.length) return null;
      const active = inst && names.includes(inst) ? inst : names[0];
      const b = data.instruments[active];
      const daily = Object.entries(b.daily).map(([k, v]) => ({ label: k, value: v }));
      const weekly = Object.entries(b.weekly).map(([k, v]) => ({ label: k, value: v }));
      const caps = data.capacities || [100, 60];

      return (
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: '0.5rem' }}>
            <h3 style={{ marginBottom: 0 }}>Throughput &amp; utilisation</h3>
            <div style={{ display: 'flex', gap: '0.4rem', alignItems: 'center', fontSize: '0.8rem' }}>
              <select value={active} onChange={e => setInst(e.target.value)}>
                {names.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
              <select value={days} onChange={e => setDays(Number(e.target.value))}>
                <option value={0}>Last 7 days · hourly</option>
                <option value={30}>30 days</option>
                <option value={60}>60 days</option>
                <option value={90}>90 days</option>
                <option value={365}>1 year</option>
              </select>
            </div>
          </div>

          <div style={{ display: 'flex', gap: '0.6rem', flexWrap: 'wrap', margin: '0.8rem 0' }}>
            <StatTile label="Acquisitions" value={b.total.toLocaleString()} sub={`${b.active_days} active days`} />
            <StatTile label="Mean / active day" value={b.mean_per_active_day} sub={`peak ${b.peak_day}`} />
            {caps.map(c => (
              <StatTile key={c} tone="accent"
                        label={`Utilisation @ ${c} SPD`}
                        value={`${b.utilization_pct[String(c)]}%`}
                        sub={`peak ${b.peak_utilization_pct[String(c)]}%`} />
            ))}
          </div>

          {days === 0 ? (
            <>
              <div style={{ fontSize: '0.8rem', color: 'var(--muted)', margin: '0.6rem 0 0.4rem' }}>
                Every hour of the last week — darker means more runs started in that hour.
              </div>
              <HourHeatmap grid={b.hour_grid} />
            </>
          ) : (
          <>
          <div style={{ fontSize: '0.8rem', color: 'var(--muted)', margin: '0.6rem 0 0.2rem' }}>
            Samples per day
            <span style={{ marginLeft: '0.6rem', color: SERIES[0] }}>■</span> acquisitions
            <span style={{ marginLeft: '0.6rem' }}>┈ dashed = SPD capacity</span>
          </div>
          <BarChart data={daily} color={SERIES[0]} height={130}
                    refLines={caps.map(c => ({ value: c, label: `${c} SPD` }))} />

          <div style={{ fontSize: '0.8rem', color: 'var(--muted)', margin: '1rem 0 0.2rem' }}>
            Samples per week
            <span style={{ marginLeft: '0.6rem', color: SERIES[1] }}>■</span> acquisitions
          </div>
          <BarChart data={weekly} color={SERIES[1]} height={110} />
          </>
          )}

          <div style={{ fontSize: '0.7rem', color: 'var(--muted)', marginTop: '0.7rem' }}>
            Counted on Hive from the Flinders archive — every acquisition, not just QC.
            Aggregate day counts only; no filenames or sample data leave the cluster.
            {data.generated_at ? ` Counted ${String(data.generated_at).slice(0, 16).replace('T', ' ')} UTC.` : ''}
          </div>
        </div>
      );
    }

    /* ── Samples tab ───────────────────────────────────────────────
       Throughput + utilisation first (the question asked most often),
       then per-sample health below. */
    function SamplesTab() {
      return (
        <>
          <UtilizationPanel />
          <SampleHealthPanel />

    /* ── Sample Health tab ─────────────────────────────────────────
       Shows non-QC files the rawmeat monitor flagged. Separate from

    function SampleHealthPanel() {

            Separate from QC gating — flagged files are surfaced for review, not held.
            (Bruker <code>.d</code> only in v0.2.89; Thermo support TBD.)
          </p>
          {rows.length === 0 ? (
            <p style={{ color: '#666' }}>No sample health rows yet. Enable <code>monitor_all_files: true</code> on a Bruker instrument to populate.</p>
          ) : (

                </tr>
              </thead>

                {rows.map(r => (
                  <tr key={r.id} style={{ borderBottom: '1px solid #f2f2f2' }}>

                    <td>{(r.run_date || '').substring(0, 19).replace('T', ' ')}</td>
                    <td style={{ color: verdictColor(r.verdict), fontWeight: 'bold' }}>{r.verdict}</td>
                    <td><PegBadge run={r} /></td>
                    <td><DriftBadge run={r} /></td>
                    <td style={{ textAlign: 'right' }}>{r.ms1_max_intensity ? r.ms1_max_intensity.toExponential(2) : '—'}</td>
                    <td style={{ textAlign: 'right' }}>{r.dropout_rate_per_100_ms1 ?? '—'}</td>
                    <td style={{ textAlign: 'right' }}>{r.rt_duration_min ?? '—'}</td>
                    <td style={{ textAlign: 'right' }}>{r.pressure_range_mbar?.toFixed(4) ?? '—'}</td>
